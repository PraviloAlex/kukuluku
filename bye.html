  :root {
    --page: #f4f1ea; --card: #fffefb; --line: #e0dbd1; --thin: #efeae1; --ink: #211e1a; --sub: #6f6a62; --faint: #8f887e;
    --acc: #f25b23; --acc-t: #c9420c; --wash: #fff0e8; --ans: #fff8f3; --ans-line: #f6dccd;
    --ui: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --page: #111316; --card: #191c21; --line: rgba(255,255,255,.12); --thin: rgba(255,255,255,.07); --ink: #f2f1f3;
      --sub: #a3a7ae; --faint: #7b8088; --acc-t: #ff6b2a; --wash: rgba(242,91,35,.14); --ans: rgba(242,91,35,.07); --ans-line: rgba(242,91,35,.22); }
  }
  html[lang="ja"] { --ui: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif; }
  html[lang="zh"] { --ui: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  html[lang="zh-TW"] { --ui: "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
  html[lang="ko"] { --ui: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; background: var(--page);
    color: var(--ink); font: 400 15px/1.5 var(--ui); -webkit-font-smoothing: antialiased; }
  main { width: 100%; max-width: 900px; padding: 26px 26px 22px; border-radius: 18px; background: var(--card);
    box-shadow: 0 0 0 1px var(--line), 0 12px 32px rgba(20,20,20,.08); }
  .head { display: flex; align-items: flex-start; gap: 14px; }
  .mark { flex: none; width: 38px; height: 38px; margin-top: 1px; filter: drop-shadow(0 2px 4px rgba(33,30,26,.12)); }
  /* Две колонки: причины слева, справа - свои слова и кнопки. */
  .cols { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 22px; align-items: start; margin-top: 18px; }
  .side { position: sticky; top: 16px; display: flex; flex-direction: column; padding: 16px; border-radius: 14px; background: var(--wash); }
  h1 { margin: 0 0 4px; font-size: 20px; line-height: 1.3; }
  p { margin: 0; color: var(--sub); }
  /* Причины - строками, как в меню Kukuluku: любая длина помещается. */
  .list { margin: 0; border-radius: 12px; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
  .row { display: flex; width: 100%; align-items: center; gap: 12px; min-height: 46px; padding: 8px 12px; border: 0; border-top: 1px solid var(--thin);

    "de": {"title":"Kukuluku wurde entfernt","ask":"Warum haben Sie es entfernt? Wählen Sie alles aus, was zutrifft: So sehen wir, was wir verbessern müssen.","reasons":["Es erschien keine Übersetzung","Meine Sprache fehlt","Die Übersetzung war fehlerhaft","Brauche ich nicht mehr","Die Übersetzung ist langsam","Menü nicht in meiner Sprache","Schwer zu verstehen","Alt+Q ist unpraktisch","Stört auf Websites"],"thanks":"Danke! Das hilft uns wirklich.","no_translation":{"lead":"Meist liegt es an einem von drei Dingen:","list":["Es war eine Chrome-Seite. Im Chrome Web Store, in den Einstellungen und auf der Seite „Neuer Tab“ lässt Chrome keine Erweiterungen zu. Öffnen Sie eine beliebige Website und markieren Sie dort Text.","Der Text ist schon in Ihrer Zielsprache, zum Beispiel eine englische Website und Übersetzung ins Englische. Dann gibt es nichts zu übersetzen und kein Fenster erscheint. Wählen Sie im Menü Ihre Sprache.","Es war Google Docs, Tabellen oder ein PDF. Markieren Sie dort den Text und drücken Sie Strg+C."]},"inaccurate":["Die Übersetzung stammt von Google Übersetzer, demselben Dienst, der in Chrome eingebaut ist.","Mit Ihrem eigenen KI-Schlüssel erklärt das Übersetzungsfenster Bedeutung, Ton und Kontext schwieriger Sätze."],"not_needed":["Danke fürs Ausprobieren. Kommen Sie wieder, wenn Sie eine Übersetzung brauchen."],"langAsk":"Welche Sprache brauchen Sie?","langPick":"Sprache wählen…","langOther":"Andere","langSend":"Senden","langSent":"Danke! Wir nehmen sie auf: Die Reihenfolge neuer Sprachen richtet sich nach solchen Antworten.","langHint":"Kukuluku übersetzt bereits in 250 Sprachen: Menü → „Alle 250 Sprachen“ → Suche.","reinstall":"Neu installieren","note":"Wir entwickeln Kukuluku, damit Lesen in jeder Sprache einfach wird. Jede Antwort zeigt uns, was wir zuerst verbessern sollten. Danke, dass Sie sich kurz Zeit genommen haben.","again":"Doch anders entschieden? Neu installieren","slow":["Die Geschwindigkeit hängt von Ihrer Internetverbindung ab und davon, wie viel Text auf der Seite steht.","Wenn Sie nur einen Teil brauchen, markieren Sie ihn: Die Übersetzung erscheint daneben, ohne dass die ganze Seite übersetzt wird."],"menuAsk":"In welcher Sprache brauchen Sie das Menü?","menuHint":"Das Menü von Kukuluku gibt es derzeit in 21 Sprachen. Übersetzen kann Kukuluku in 250.","hard":{"lead":"Im Grunde sind es drei Handgriffe:","list":["Markieren Sie Text mit der Maus: Die Übersetzung erscheint daneben.","Halten Sie Alt+Q gedrückt: Die ganze Seite ist in Ihrer Sprache. Loslassen, und das Original ist wieder da.","Halten Sie Alt gedrückt und zeigen Sie mit der Maus auf einen Absatz: Die Übersetzung erscheint darunter."]},"hotkey":["Die Tastenkombination Alt+Q lässt sich derzeit nicht ändern.","Ihre Antwort zeigt uns, dass eine frei wählbare Tastenkombination gebraucht wird."],"annoying":{"lead":"Das lässt sich einstellen, ohne Kukuluku zu entfernen:","list":["Übersetzung nur per Tastenkombination: Wählen Sie im Menü bei „Übersetzung zeigen“ die Option „Alt+Q“. Dann zeigt das Markieren allein nichts an.","Auf einer Website ausschalten: Schalten Sie auf dem Hauptbildschirm des Menüs auf „hier wird nicht übersetzt“ um.","Pause: Wählen Sie im Menü unter „Pause“ 15 Minuten, eine Stunde, bis morgen oder bis Sie wieder einschalten."]},"textLabel":"Beschreiben Sie, was nicht gepasst hat","textPlaceholder":"Je genauer, desto besser erkennen wir, was zu beheben ist: was gestört hat, auf welcher Website, in welchem Moment.","send":"Senden","sentNote":"Ihre Antwort wurde gesendet.","mailLabel":"E-Mail für unsere Antwort","mailHint":"Geben Sie sie an, dann melden wir uns, wenn wir der Sache nachgegangen sind.","mailBad":"Die Adresse scheint einen Tippfehler zu enthalten.","sentMail":"Ihre Antwort wurde gesendet. Wir schreiben Ihnen per E-Mail."},
    "fr": {"title":"Kukuluku a été supprimé","ask":"Pourquoi l’avez-vous supprimé ? Cochez tout ce qui correspond : ainsi, nous saurons quoi corriger.","reasons":["Aucune traduction n’apparaissait","Ma langue n’est pas disponible","La traduction contenait des erreurs","Je n’en ai plus besoin","La traduction est lente","Le menu n’est pas dans ma langue","Difficile à prendre en main","Raccourci Alt+Q peu pratique","Gênant sur les sites web"],"thanks":"Merci ! Cela nous aide vraiment.","no_translation":{"lead":"En général, c’est l’une de ces trois raisons :","list":["C’était une page Chrome. Chrome interdit toute extension sur le Chrome Web Store, dans les paramètres et sur la page Nouvel onglet. Ouvrez n’importe quel site et sélectionnez-y du texte.","Le texte était déjà dans votre langue de traduction : par exemple, un site en anglais et une traduction vers l’anglais. Il n’y a rien à traduire, donc aucune fenêtre n’apparaît. Choisissez votre langue dans le menu.","C’était Google Docs, Sheets ou un PDF. Sélectionnez-y le texte et appuyez sur Ctrl+C."]},"inaccurate":["La traduction vient de Google Traduction, le même service que celui intégré à Chrome.","Avec votre propre clé d’IA, la fenêtre de traduction explique le sens, le ton et le contexte des phrases difficiles."],"not_needed":["Merci de l’avoir essayé. Revenez quand vous aurez de nouveau besoin d’une traduction."],"langAsk":"De quelle langue avez-vous besoin ?","langPick":"Choisir une langue…","langOther":"Autre","langSend":"Envoyer","langSent":"Merci ! Nous l’ajouterons : ces réponses décident de l’ordre des nouvelles langues.","langHint":"Kukuluku traduit déjà vers 250 langues : menu → « Les 250 langues » → recherche.","reinstall":"Réinstaller","note":"Nous créons Kukuluku pour que lire dans n’importe quelle langue soit simple. Chaque réponse nous montre ce qu’il faut améliorer en priorité. Merci d’avoir pris une minute.","again":"Vous avez changé d’avis ? Réinstaller","slow":["La vitesse dépend de votre connexion Internet et de la quantité de texte sur la page.","Si vous n’avez besoin que d’un passage, sélectionnez-le : la traduction apparaît à côté, sans traduire toute la page."],"menuAsk":"Dans quelle langue voulez-vous le menu ?","menuHint":"Le menu de Kukuluku est pour l’instant disponible en 21 langues. Kukuluku sait traduire vers 250 langues.","hard":{"lead":"L’essentiel tient en trois gestes :","list":["Sélectionnez du texte avec la souris : la traduction apparaît à côté.","Maintenez Alt+Q : toute la page passe dans votre langue. Relâchez : l’original revient.","Maintenez Alt et pointez un paragraphe avec la souris : la traduction apparaît en dessous."]},"hotkey":["Pour l’instant, le raccourci Alt+Q ne peut pas être modifié.","Votre réponse nous montre qu’il faut pouvoir choisir son propre raccourci."],"annoying":{"lead":"Vous pouvez régler cela sans le supprimer :","list":["Traduction seulement au raccourci : dans le menu, à « Afficher la traduction », choisissez « Alt+Q ». La sélection seule n’affiche alors rien.","Désactiver sur un seul site : sur l’écran principal du menu, passez à « pas de traduction ici ».","Pause : dans le menu « Pause », choisissez 15 minutes, une heure, jusqu’à demain ou jusqu’à ce que vous réactiviez."]},"textLabel":"Décrivez ce qui n’allait pas","textPlaceholder":"Plus vous donnez de détails, mieux nous saurons quoi corriger : ce qui posait problème, sur quel site, à quel moment.","send":"Envoyer","sentNote":"Votre réponse a été envoyée.","mailLabel":"E-mail pour vous répondre","mailHint":"Laissez-le, et nous vous écrirons une fois la question examinée.","mailBad":"Il semble y avoir une faute de frappe dans l’adresse.","sentMail":"Votre réponse a été envoyée. Nous vous écrirons par e-mail."},
    "es": {"title":"Kukuluku se ha eliminado","ask":"¿Por qué lo eliminaste? Marca todo lo que corresponda: así sabremos qué arreglar.","reasons":["No aparecía la traducción","Falta mi idioma","La traducción tenía errores","Ya no lo necesito","La traducción es lenta","El menú no está en mi idioma","Difícil de entender","El atajo Alt+Q es incómodo","Molesta en los sitios web"],"thanks":"¡Gracias! Esto ayuda de verdad.","no_translation":{"lead":"Normalmente es una de estas tres cosas:","list":["Era una página de Chrome. Chrome no permite extensiones en Chrome Web Store, en la configuración ni en la página de nueva pestaña. Abre cualquier sitio web y selecciona texto allí.","El texto ya estaba en tu idioma de traducción: por ejemplo, un sitio en inglés y traducción al inglés. No hay nada que traducir, así que no aparece la ventana. Elige tu idioma en el menú.","Era Google Docs, Hojas de cálculo o un PDF. Allí selecciona el texto y pulsa Ctrl+C."]},"inaccurate":["La traducción viene de Google Translate, el mismo que está integrado en Chrome.","Con tu propia clave de IA, la ventana de traducción explica el sentido, el tono y el contexto de las frases difíciles."],"not_needed":["Gracias por probarlo. Vuelve cuando necesites una traducción."],"langAsk":"¿Qué idioma necesitas?","langPick":"Elige un idioma…","langOther":"Otro","langSend":"Enviar","langSent":"¡Gracias! Lo añadiremos: estas respuestas deciden el orden de los nuevos idiomas.","langHint":"Kukuluku ya traduce a 250 idiomas: menú → «Los 250 idiomas» → búsqueda.","reinstall":"Instalar de nuevo","note":"Hacemos Kukuluku para que leer en cualquier idioma sea fácil. Cada respuesta nos muestra qué mejorar primero. Gracias por dedicarnos un minuto.","again":"¿Cambiaste de opinión? Instalar de nuevo","slow":["La velocidad depende de tu conexión a internet y de cuánto texto hay en la página.","Si solo necesitas una parte, selecciónala: la traducción aparece al lado, sin traducir toda la página."],"menuAsk":"¿En qué idioma necesitas el menú?","menuHint":"Por ahora, el menú de Kukuluku está en 21 idiomas. Y puede traducir a 250.","hard":{"lead":"Lo esencial son tres gestos:","list":["Selecciona texto con el ratón: la traducción aparece al lado.","Mantén Alt+Q: toda la página aparece en tu idioma. Suelta: vuelve el original.","Mantén Alt y señala un párrafo con el ratón: la traducción aparece debajo."]},"hotkey":["Por ahora, el atajo Alt+Q no se puede cambiar.","Tu respuesta nos indica que hace falta poder elegir tu propio atajo."],"annoying":{"lead":"Puedes ajustarlo sin eliminarlo:","list":["Traducción solo con el atajo: en el menú, en «Mostrar traducción», elige «Alt+Q». Así, seleccionar texto no muestra nada por sí solo.","Desactivar en un solo sitio: en la pantalla principal del menú, cambia a «aquí no se traduce».","Pausa: en el menú, en «Pausa», elige 15 minutos, una hora, hasta mañana o hasta que lo actives."]},"textLabel":"Cuéntanos qué no fue bien","textPlaceholder":"Cuantos más detalles, mejor entenderemos qué arreglar: qué te molestó, en qué sitio web, en qué momento.","send":"Enviar","sentNote":"Respuesta enviada.","mailLabel":"Correo para responderte","mailHint":"Déjalo y te escribiremos cuando lo hayamos revisado.","mailBad":"Parece que hay un error en la dirección.","sentMail":"Respuesta enviada. Te escribiremos por correo."},
    "pt": {"title":"O Kukuluku foi removido","ask":"Por que você removeu? Marque tudo o que se aplica: assim saberemos o que corrigir.","reasons":["A tradução não apareceu","Meu idioma não está disponível","A tradução tinha erros","Não preciso mais","A tradução é lenta","O menu não está no meu idioma","Difícil de entender","O atalho Alt+Q não é prático","Atrapalha nos sites"],"thanks":"Obrigado! Isso ajuda de verdade.","no_translation":{"lead":"Normalmente é uma destas três coisas:","list":["Era uma página do Chrome. O Chrome não permite extensões na Chrome Web Store, nas configurações nem na página de nova guia. Abra qualquer site e selecione o texto lá.","O texto já estava no seu idioma de tradução: por exemplo, um site em inglês e tradução para o inglês. Não há o que traduzir, por isso a janela não aparece. Escolha o seu idioma no menu.","Era o Google Docs, o Planilhas ou um PDF. Nesses casos, selecione o texto e pressione Ctrl+C."]},"inaccurate":["A tradução vem do Google Tradutor, o mesmo que está integrado ao Chrome.","Com sua própria chave de IA, a janela de tradução explica o sentido, o tom e o contexto de frases difíceis."],"not_needed":["Obrigado por experimentar. Volte quando precisar de uma tradução."],"langAsk":"De qual idioma você precisa?","langPick":"Escolha um idioma…","langOther":"Outro","langSend":"Enviar","langSent":"Obrigado! Vamos adicioná-lo: essas respostas definem a ordem dos novos idiomas.","langHint":"O Kukuluku já traduz para 250 idiomas: menu → “Todos os 250 idiomas” → pesquisa.","reinstall":"Instalar novamente","note":"Fazemos o Kukuluku para que ler em qualquer idioma seja simples. Cada resposta mostra o que melhorar primeiro. Obrigado por tirar um minutinho.","again":"Mudou de ideia? Instalar novamente","slow":["A velocidade depende da internet e de quanto texto há na página.","Se você só precisa de um trecho, selecione-o: a tradução aparece ao lado, sem traduzir a página inteira."],"menuAsk":"Em qual idioma você precisa do menu?","menuHint":"Por enquanto, o menu do Kukuluku está em 21 idiomas. Ele traduz para 250.","hard":{"lead":"O essencial são três gestos:","list":["Selecione um texto com o mouse: a tradução aparece ao lado.","Segure Alt+Q: a página inteira fica no seu idioma. Solte: volta o original.","Segure Alt e aponte o mouse para um parágrafo: a tradução aparece embaixo dele."]},"hotkey":["Por enquanto, não dá para mudar o atalho Alt+Q.","Sua resposta nos mostra que é preciso poder escolher seu próprio atalho."],"annoying":{"lead":"Dá para ajustar isso sem remover:","list":["Tradução só pelo atalho: no menu, em “Mostrar tradução”, escolha “Alt+Q”. Assim, selecionar um texto não mostra nada sozinho.","Desligar em um site: na tela principal do menu, mude para “sem tradução aqui”.","Pausa: no menu, em “Pausar”, escolha 15 minutos, 1 hora, até amanhã ou até você ligar."]},"textLabel":"Conte o que não deu certo","textPlaceholder":"Quanto mais detalhes, melhor vamos entender o que corrigir: o que atrapalhou, em qual site, em que momento.","send":"Enviar","sentNote":"Resposta enviada.","mailLabel":"E-mail para resposta","mailHint":"Deixe aqui, e vamos escrever para você depois de analisar o caso.","mailBad":"Parece que há um erro de digitação no endereço.","sentMail":"Resposta enviada. Vamos escrever para você por e-mail."},
    "pl": {"title":"Kukuluku został usunięty","ask":"Dlaczego go usunięto? Zaznacz wszystko, co pasuje: dzięki temu dowiemy się, co naprawić.","reasons":["Tłumaczenie się nie pojawiało","Brakuje mojego języka","Tłumaczenie miało błędy","Już nie jest potrzebny","Tłumaczenie działa wolno","Menu nie jest w moim języku","Trudno zrozumieć, jak działa","Niewygodny skrót Alt+Q","Przeszkadza na stronach"],"thanks":"Dziękujemy! To naprawdę pomaga.","no_translation":{"lead":"Zwykle chodzi o jedną z trzech rzeczy:","list":["To była strona Chrome. W Chrome Web Store, ustawieniach i na stronie nowej karty Chrome nie dopuszcza żadnych rozszerzeń. Otwórz dowolną stronę i zaznacz tekst tam.","Tekst był już w języku tłumaczenia, na przykład angielska strona i tłumaczenie na angielski. Nie ma czego tłumaczyć, więc okno się nie pojawia. Wybierz w menu swój język.","To były Dokumenty Google, Arkusze lub PDF. Tam zaznacz tekst i naciśnij Ctrl+C."]},"inaccurate":["Tłumaczenie pochodzi z Tłumacza Google, tego samego, który jest wbudowany w Chrome.","Z własnym kluczem AI okno tłumaczenia wyjaśni znaczenie, ton i kontekst trudnych zdań."],"not_needed":["Dziękujemy za wypróbowanie. Wróć, gdy znów będziesz potrzebować tłumaczenia."],"langAsk":"Jakiego języka potrzebujesz?","langPick":"Wybierz język…","langOther":"Inny","langSend":"Wyślij","langSent":"Dziękujemy! Dodamy go: kolejność nowych języków ustalamy na podstawie takich odpowiedzi.","langHint":"Kukuluku tłumaczy już na 250 języków: menu → „Wszystkie języki · 250” → wyszukiwanie.","reinstall":"Zainstaluj ponownie","note":"Tworzymy Kukuluku, żeby czytanie w każdym języku było proste. Każda odpowiedź pokazuje, co ulepszyć w pierwszej kolejności. Dziękujemy za poświęconą chwilę.","again":"Zmiana decyzji? Zainstaluj ponownie","slow":["Szybkość zależy od internetu i od tego, ile tekstu jest na stronie.","Jeśli potrzebujesz tylko fragmentu, zaznacz go: tłumaczenie pojawi się obok, bez tłumaczenia całej strony."],"menuAsk":"W jakim języku potrzebujesz menu?","menuHint":"Menu Kukuluku jest teraz dostępne w 21 językach. Tłumaczyć potrafi na 250.","hard":{"lead":"Najważniejsze są trzy ruchy:","list":["Zaznacz tekst myszą - tłumaczenie pojawi się obok.","Przytrzymaj Alt+Q - cała strona jest w Twoim języku. Puść - wraca oryginał.","Przytrzymaj Alt i wskaż myszą akapit - tłumaczenie pojawi się pod nim."]},"hotkey":["Na razie skrótu Alt+Q nie można zmienić.","Twoja odpowiedź pokaże nam, że możliwość wyboru własnego skrótu jest potrzebna."],"annoying":{"lead":"Można to ustawić bez usuwania:","list":["Tłumaczenie tylko skrótem: w menu przy „Pokazuj tłumaczenie” wybierz „Alt+Q”. Wtedy samo zaznaczenie niczego nie pokazuje.","Wyłączenie na jednej stronie: na głównym ekranie menu przełącz na „tu nie tłumaczymy”.","Pauza: w menu „Pauza” wybierz 15 minut, godzinę, do jutra albo aż włączysz."]},"textLabel":"Opisz, co poszło nie tak","textPlaceholder":"Im więcej szczegółów, tym lepiej zrozumiemy, co poprawić: co przeszkadzało, na jakiej stronie, w jakim momencie.","send":"Wyślij","sentNote":"Odpowiedź została wysłana.","mailLabel":"E-mail do odpowiedzi","mailHint":"Zostaw go, a napiszemy, gdy przyjrzymy się sprawie.","mailBad":"Wygląda na to, że w adresie jest literówka.","sentMail":"Odpowiedź została wysłana. Napiszemy do Ciebie e-mailem."},
    "it": {"title":"Kukuluku è stato rimosso","ask":"Perché l’hai rimosso? Seleziona tutto ciò che corrisponde: così capiremo cosa correggere.","reasons":["La traduzione non appariva","Manca la mia lingua","La traduzione aveva errori","Non mi serve più","La traduzione è lenta","Il menu non è nella mia lingua","Difficile da capire","Scorciatoia Alt+Q scomoda","Disturba sui siti"],"thanks":"Grazie! È davvero utile.","no_translation":{"lead":"Di solito è una di queste tre cose:","list":["Era una pagina di Chrome. Chrome non consente estensioni nel Chrome Web Store, nelle impostazioni e nella pagina Nuova scheda. Apri un qualsiasi sito e seleziona lì il testo.","Il testo era già nella tua lingua di traduzione: per esempio un sito in inglese e la traduzione in inglese. Non c’è nulla da tradurre, quindi la finestra non appare. Scegli la tua lingua nel menu.","Era Google Documenti, Fogli o un PDF. Lì seleziona il testo e premi Ctrl+C."]},"inaccurate":["La traduzione arriva da Google Traduttore, lo stesso integrato in Chrome.","Con la tua chiave IA, la finestra di traduzione spiega significato, tono e contesto delle frasi difficili."],"not_needed":["Grazie per averlo provato. Torna quando ti servirà una traduzione."],"langAsk":"Di quale lingua hai bisogno?","langPick":"Scegli una lingua…","langOther":"Altra","langSend":"Invia","langSent":"Grazie! La aggiungeremo: l’ordine delle nuove lingue dipende da risposte come questa.","langHint":"Kukuluku traduce già in 250 lingue: menu → «All 250 languages» → ricerca.","reinstall":"Installa di nuovo","note":"Creiamo Kukuluku perché leggere in qualsiasi lingua sia semplice. Ogni risposta ci mostra cosa migliorare prima di tutto. Grazie per averci dedicato un minuto.","again":"Hai cambiato idea? Installa di nuovo","slow":["La velocità dipende dalla connessione e da quanto testo c’è nella pagina.","Se ti serve solo una parte, selezionala: la traduzione appare accanto, senza tradurre tutta la pagina."],"menuAsk":"In quale lingua ti serve il menu?","menuHint":"Per ora il menu di Kukuluku è in 21 lingue. Traduce invece in 250.","hard":{"lead":"L’essenziale sono tre gesti:","list":["Seleziona il testo con il mouse: la traduzione appare accanto.","Tieni premuto Alt+Q: tutta la pagina è nella tua lingua. Rilascia: torna l’originale.","Tieni premuto Alt e punta il mouse su un paragrafo: la traduzione appare sotto."]},"hotkey":["Per ora la scorciatoia Alt+Q non si può cambiare.","La tua risposta ci dice che serve poter scegliere una scorciatoia propria."],"annoying":{"lead":"Puoi regolarlo senza rimuoverlo:","list":["Traduzione solo con la scorciatoia: nel menu, in «Show translation», scegli «Alt+Q». Così la sola selezione non mostra nulla.","Disattivare su un solo sito: nella schermata principale del menu, passa a «not translating here».","Pausa: nel menu, in «Pause», scegli 15 minuti, un’ora, fino a domani o finché non lo riattivi."]},"textLabel":"Raccontaci cosa non è andato bene","textPlaceholder":"Più dettagli ci dai, meglio capiamo cosa correggere: cosa dava fastidio, su quale sito, in quale momento.","send":"Invia","sentNote":"Risposta inviata.","mailLabel":"E-mail per la risposta","mailHint":"Lasciala e ti scriveremo dopo aver controllato.","mailBad":"Sembra che ci sia un errore di battitura nell’indirizzo.","sentMail":"Risposta inviata. Ti scriveremo via e-mail."},
    "nl": {"title":"Kukuluku is verwijderd","ask":"Waarom heb je het verwijderd? Vink alles aan wat van toepassing is: zo weten we wat we moeten verbeteren.","reasons":["Er verscheen geen vertaling","Mijn taal ontbreekt","De vertaling bevatte fouten","Ik heb het niet meer nodig","Vertalen gaat traag","Het menu is niet in mijn taal","Lastig te begrijpen","Sneltoets Alt+Q is onhandig","Zit in de weg op websites"],"thanks":"Bedankt! Dit helpt echt.","no_translation":{"lead":"Meestal is het een van deze drie dingen:","list":["Het was een Chrome-pagina. Chrome laat geen extensies toe in de Chrome Web Store, de instellingen en op de pagina Nieuw tabblad. Open een willekeurige website en selecteer daar tekst.","De tekst stond al in je vertaaltaal: bijvoorbeeld een Engelse site en vertaling naar het Engels. Er valt niets te vertalen, dus er verschijnt geen venster. Kies je eigen taal in het menu.","Het was Google Documenten, Spreadsheets of een pdf. Selecteer daar de tekst en druk op Ctrl+C."]},"inaccurate":["De vertaling komt van Google Translate, dezelfde die in Chrome is ingebouwd.","Met je eigen AI-sleutel legt het vertaalvenster de betekenis, toon en context van lastige zinnen uit."],"not_needed":["Bedankt voor het proberen. Kom terug wanneer je weer een vertaling nodig hebt."],"langAsk":"Welke taal heb je nodig?","langPick":"Kies een taal…","langOther":"Andere","langSend":"Versturen","langSent":"Bedankt! We voegen hem toe: zulke antwoorden bepalen de volgorde van nieuwe talen.","langHint":"Kukuluku vertaalt al naar 250 talen: menu → “All 250 languages” → zoeken.","reinstall":"Opnieuw installeren","note":"We maken Kukuluku zodat lezen in elke taal eenvoudig is. Elk antwoord laat zien wat we als eerste moeten verbeteren. Bedankt dat je even de tijd nam.","again":"Toch van gedachten veranderd? Opnieuw installeren","slow":["De snelheid hangt af van je internetverbinding en van hoeveel tekst er op de pagina staat.","Heb je maar een stukje nodig? Selecteer het: de vertaling verschijnt ernaast, zonder de hele pagina te vertalen."],"menuAsk":"In welke taal heb je het menu nodig?","menuHint":"Het menu van Kukuluku is nu beschikbaar in 21 talen. Vertalen kan Kukuluku naar 250 talen.","hard":{"lead":"Het draait om drie handelingen:","list":["Selecteer tekst met de muis: de vertaling verschijnt ernaast.","Houd Alt+Q ingedrukt: de hele pagina staat in jouw taal. Laat los: het origineel is terug.","Houd Alt ingedrukt en wijs met de muis een alinea aan: de vertaling verschijnt eronder."]},"hotkey":["Voorlopig kun je de sneltoets Alt+Q niet wijzigen.","Je antwoord laat ons weten dat het nodig is om zelf een sneltoets te kiezen."],"annoying":{"lead":"Je kunt dit instellen zonder het te verwijderen:","list":["Alleen vertalen met de sneltoets: kies in het menu bij “Show translation” voor “Alt+Q”. Dan laat alleen selecteren niets zien.","Uitzetten op één site: schakel op het hoofdscherm van het menu over naar “not translating here”.","Pauze: kies in het menu bij “Pause” 15 minuten, een uur, tot morgen of tot je het weer aanzet."]},"textLabel":"Beschrijf wat er misging","textPlaceholder":"Hoe meer details, hoe beter we begrijpen wat we moeten oplossen: waar je tegenaan liep, op welke site, op welk moment.","send":"Versturen","sentNote":"Je antwoord is verstuurd.","mailLabel":"E-mailadres voor ons antwoord","mailHint":"Laat het achter, dan mailen we je als we ernaar hebben gekeken.","mailBad":"Er lijkt een typfout in het adres te staan.","sentMail":"Je antwoord is verstuurd. We mailen je terug."},
    "ro": {"title":"Kukuluku a fost eliminat","ask":"De ce l-ați eliminat? Bifați tot ce se potrivește: așa vom înțelege ce să reparăm.","reasons":["Traducerea nu a apărut","Limba mea lipsește","Traducerea avea erori","Nu îmi mai trebuie","Traducerea este lentă","Meniul nu e în limba mea","Greu de înțeles","Combinația Alt+Q e incomodă","Deranjează pe site-uri"],"thanks":"Mulțumim! Chiar ne ajută.","no_translation":{"lead":"De obicei este vorba de unul dintre aceste trei lucruri:","list":["Era o pagină Chrome. Chrome nu permite extensii în Magazinul web Chrome, în setări și pe pagina de filă nouă. Deschideți orice site și selectați textul acolo.","Textul era deja în limba de traducere: de exemplu, un site în engleză și traducere în engleză. Nu este nimic de tradus, așa că fereastra nu apare. Alegeți limba dvs. din meniu.","Era Google Docs, Sheets sau un PDF. Acolo selectați textul și apăsați Ctrl+C."]},"inaccurate":["Traducerea vine de la Google Traducere, același serviciu integrat în Chrome.","Cu propria cheie AI, fereastra de traducere explică sensul, tonul și contextul frazelor dificile."],"not_needed":["Mulțumim că l-ați încercat. Reveniți când aveți din nou nevoie de o traducere."],"langAsk":"De ce limbă aveți nevoie?","langPick":"Alegeți o limbă…","langOther":"Alta","langSend":"Trimiteți","langSent":"Mulțumim! O vom adăuga: ordinea noilor limbi depinde de astfel de răspunsuri.","langHint":"Kukuluku traduce deja în 250 de limbi: meniu → „All 250 languages” → căutare.","reinstall":"Instalați din nou","note":"Facem Kukuluku pentru ca cititul în orice limbă să fie simplu. Fiecare răspuns ne arată ce să îmbunătățim mai întâi. Vă mulțumim pentru minutul acordat.","again":"V-ați răzgândit? Instalați din nou","slow":["Viteza depinde de internet și de cât text este pe pagină.","Dacă vă trebuie doar o parte, selectați-o: traducerea apare alături, fără să se traducă toată pagina."],"menuAsk":"În ce limbă aveți nevoie de meniu?","menuHint":"Meniul Kukuluku este deocamdată în 21 de limbi. Traduce însă în 250 de limbi.","hard":{"lead":"Totul se rezumă la trei gesturi:","list":["Selectați textul cu mouse-ul: traducerea apare alături.","Țineți apăsat Alt+Q: toată pagina este în limba dvs. Dați drumul: revine originalul.","Țineți apăsat Alt și duceți mouse-ul pe un paragraf: traducerea apare sub el."]},"hotkey":["Deocamdată combinația Alt+Q nu poate fi schimbată.","Răspunsul dvs. ne arată că e nevoie să puteți alege propria combinație de taste."],"annoying":{"lead":"Puteți regla asta fără să-l eliminați:","list":["Traducere doar cu tastele: în meniu, la „Show translation”, alegeți „Alt+Q”. Atunci simpla selectare nu mai afișează nimic.","Dezactivare pe un singur site: pe ecranul principal al meniului, comutați pe „not translating here”.","Pauză: în meniu, la „Pause”, alegeți 15 minute, o oră, până mâine sau până îl porniți din nou."]},"textLabel":"Descrieți ce nu a mers bine","textPlaceholder":"Cu cât mai multe detalii, cu atât înțelegem mai bine ce trebuie reparat: ce v-a deranjat, pe ce site, în ce moment.","send":"Trimiteți","sentNote":"Răspunsul a fost trimis.","mailLabel":"E-mail pentru răspuns","mailHint":"Lăsați-l și vă vom scrie după ce analizăm situația.","mailBad":"Se pare că adresa conține o greșeală de tastare.","sentMail":"Răspunsul a fost trimis. Vă vom scrie pe e-mail."},
    "hu": {"title":"A Kukuluku eltávolítva","ask":"Miért távolította el? Jelöljön be mindent, ami igaz: így megtudjuk, mit kell javítani.","reasons":["Nem jelent meg a fordítás","Hiányzik a nyelvem","Hibás volt a fordítás","Már nincs rá szükségem","Lassan fordít","Nem a nyelvemen van a menü","Nehéz kiigazodni rajta","Kényelmetlen az Alt+Q","Zavar a webhelyeken"],"thanks":"Köszönjük! Ez tényleg segít.","no_translation":{"lead":"Általában a következő három dolog egyike okozza:","list":["Chrome-oldal volt. A Chrome Internetes áruházban, a beállításokban és az új lap oldalán a Chrome nem enged működni bővítményeket. Nyisson meg bármilyen webhelyet, és ott jelöljön ki szöveget.","A szöveg már a fordítás nyelvén volt: például angol webhely és angolra fordítás. Nincs mit lefordítani, ezért az ablak nem jelenik meg. Válassza ki a saját nyelvét a menüben.","Google Dokumentumok, Táblázatok vagy PDF volt. Ott jelölje ki a szöveget, és nyomja meg a Ctrl+C billentyűket."]},"inaccurate":["A fordítás a Google Fordítótól származik, amely a Chrome-ba is be van építve.","Saját AI-kulccsal a fordítóablak megmagyarázza a nehéz mondatok jelentését, hangnemét és szövegkörnyezetét."],"not_needed":["Köszönjük, hogy kipróbálta. Térjen vissza, ha ismét fordításra van szüksége."],"langAsk":"Milyen nyelvre van szüksége?","langPick":"Válasszon nyelvet…","langOther":"Másik","langSend":"Küldés","langSent":"Köszönjük! Hozzáadjuk: az új nyelvek sorrendjét az ilyen válaszok döntik el.","langHint":"A Kukuluku már 250 nyelvre fordít: menü → „All 250 languages” → keresés.","reinstall":"Újratelepítés","note":"A Kukuluku azért készül, hogy bármilyen nyelven egyszerű legyen olvasni. Minden válaszból látjuk, min javítsunk először. Köszönjük, hogy szánt rá egy percet.","again":"Meggondolta magát? Újratelepítés","slow":["A sebesség az internetkapcsolattól és attól függ, mennyi szöveg van az oldalon.","Ha csak egy részre van szüksége, jelölje ki: a fordítás mellette jelenik meg, az egész oldal lefordítása nélkül."],"menuAsk":"Milyen nyelven van szüksége a menüre?","menuHint":"A Kukuluku menüje jelenleg 21 nyelven érhető el. Fordítani 250 nyelvre tud.","hard":{"lead":"A lényeg három mozdulat:","list":["Jelöljön ki szöveget az egérrel: a fordítás mellette jelenik meg.","Tartsa lenyomva az Alt+Q billentyűket: az egész oldal az Ön nyelvén lesz. Engedje el: újra az eredeti látszik.","Tartsa lenyomva az Alt billentyűt, és vigye az egeret egy bekezdésre: a fordítás alatta jelenik meg."]},"hotkey":["Az Alt+Q billentyűkombinációt egyelőre nem lehet megváltoztatni.","Válasza jelzi nekünk, hogy szükség van arra, hogy saját billentyűt választhasson."],"annoying":{"lead":"Ez eltávolítás nélkül is beállítható:","list":["Fordítás csak billentyűre: a menüben a „Show translation” résznél válassza az „Alt+Q” lehetőséget. Ekkor a kijelölés önmagában semmit sem mutat.","Kikapcsolás egy webhelyen: a menü főképernyőjén váltson „not translating here” állásra.","Szünet: a menüben a „Pause” alatt válasszon 15 percet, egy órát, holnapig vagy amíg vissza nem kapcsolja."]},"textLabel":"Írja le, mi nem volt rendben","textPlaceholder":"Minél részletesebb, annál pontosabban látjuk, mit kell javítani: mi zavarta, melyik webhelyen, melyik pillanatban.","send":"Küldés","sentNote":"Válaszát elküldtük.","mailLabel":"E-mail-cím a válaszhoz","mailHint":"Adja meg, és írunk Önnek, miután utánajártunk a dolognak.","mailBad":"Úgy tűnik, elírás van a címben.","sentMail":"Válaszát elküldtük. E-mailben írunk Önnek."},
    "tr": {"title":"Kukuluku kaldırıldı","ask":"Neden kaldırdınız? Uyan her şeyi işaretleyin: böylece neyi düzelteceğimizi anlarız.","reasons":["Çeviri görünmedi","Dilim yok","Çeviride hatalar vardı","Artık ihtiyacım yok","Çeviri yavaş","Menü benim dilimde değil","Anlaması zor","Alt+Q kısayolu kullanışsız","Sitelerde rahatsız ediyor"],"thanks":"Teşekkürler! Bu gerçekten işimize yarıyor.","no_translation":{"lead":"Genellikle şu üç şeyden biridir:","list":["Bir Chrome sayfasıydı. Chrome; Chrome Web Mağazası, ayarlar ve yeni sekme sayfasında hiçbir uzantıya izin vermez. Herhangi bir site açın ve metni orada seçin.","Metin zaten çeviri dilinizdeydi: örneğin İngilizce bir site ve İngilizceye çeviri. Çevrilecek bir şey olmadığı için pencere görünmez. Menüden kendi dilinizi seçin.","Google Dokümanlar, E-Tablolar veya PDF’ti. Orada metni seçip Ctrl+C tuşlarına basın."]},"inaccurate":["Çeviri, Chrome’da yerleşik olan Google Çeviri’den gelir.","Kendi yapay zekâ anahtarınızla çeviri penceresi zor ifadelerin anlamını, tonunu ve bağlamını açıklar."],"not_needed":["Denediğiniz için teşekkürler. Yine çeviriye ihtiyaç duyduğunuzda geri gelin."],"langAsk":"Hangi dile ihtiyacınız var?","langPick":"Dil seçin…","langOther":"Diğer","langSend":"Gönder","langSent":"Teşekkürler! Ekleyeceğiz: yeni dillerin sırasını bu yanıtlar belirliyor.","langHint":"Kukuluku zaten 250 dile çeviriyor: menü → “Tüm diller · 250” → arama.","reinstall":"Yeniden yükle","note":"Kukuluku ile her dilde okumak kolay olsun diye çalışıyoruz. Her yanıt, önce neyi iyileştireceğimizi gösteriyor. Bir dakikanızı ayırdığınız için teşekkürler.","again":"Fikrinizi mi değiştirdiniz? Yeniden yükleyin","slow":["Hız, internet bağlantınıza ve sayfadaki metin miktarına bağlıdır.","Yalnızca bir bölüm gerekiyorsa onu seçin: çeviri, tüm sayfayı çevirmeden yanında görünür."],"menuAsk":"Menüye hangi dilde ihtiyacınız var?","menuHint":"Kukuluku menüsü şu anda 21 dilde. Çeviriyi ise 250 dile yapabiliyor.","hard":{"lead":"Temelde üç hareket var:","list":["Metni fareyle seçin: çeviri yanında görünür.","Alt+Q’yu basılı tutun: tüm sayfa sizin dilinizde olur. Bırakın: yeniden orijinal görünür.","Alt’ı basılı tutup fareyle bir paragrafın üzerine gelin: çeviri altında görünür."]},"hotkey":["Şimdilik Alt+Q kısayolu değiştirilemiyor.","Yanıtınız, kendi kısayolunuzu seçebilmenin gerekli olduğunu bize gösterir."],"annoying":{"lead":"Kaldırmadan da ayarlayabilirsiniz:","list":["Yalnızca kısayolla çeviri: menüde “Çeviriyi göster” satırında “Alt+Q”yu seçin. Böylece metni seçmek tek başına bir şey göstermez.","Tek bir sitede kapatma: menünün ana ekranında “burada çevrilmiyor” durumuna geçin.","Duraklatma: menüdeki “Duraklat” ile 15 dakika, 1 saat, yarına kadar ya da siz açana kadar."]},"textLabel":"Neyin ters gittiğini anlatın","textPlaceholder":"Ne kadar ayrıntılı anlatırsanız neyi düzelteceğimizi o kadar iyi anlarız: ne rahatsız etti, hangi sitede, hangi anda.","send":"Gönder","sentNote":"Yanıtınız gönderildi.","mailLabel":"Yanıt için e-posta","mailHint":"Bırakın, inceledikten sonra size yazacağız.","mailBad":"Adreste bir yazım hatası var gibi görünüyor.","sentMail":"Yanıtınız gönderildi. Size e-postayla yazacağız."},
    "vi": {"title":"Đã gỡ Kukuluku","ask":"Vì sao bạn gỡ? Hãy chọn tất cả lý do phù hợp để chúng tôi biết cần sửa gì.","reasons":["Bản dịch không hiện ra","Không có ngôn ngữ của tôi","Bản dịch có lỗi","Không cần nữa","Dịch chậm","Menu không có ngôn ngữ của tôi","Khó hiểu cách dùng","Phím tắt Alt+Q bất tiện","Gây phiền trên các trang web"],"thanks":"Cảm ơn bạn! Điều này thực sự có ích.","no_translation":{"lead":"Thường là một trong ba lý do sau:","list":["Đó là trang của Chrome. Chrome không cho tiện ích nào chạy trong Cửa hàng Chrome trực tuyến, trang cài đặt và trang thẻ mới. Hãy mở một trang web bất kỳ và chọn văn bản ở đó.","Văn bản đã ở sẵn ngôn ngữ dịch của bạn: ví dụ trang tiếng Anh và dịch sang tiếng Anh. Không có gì để dịch nên cửa sổ không hiện ra. Hãy chọn ngôn ngữ của bạn trong menu.","Đó là Google Tài liệu, Trang tính hoặc PDF. Ở đó, hãy chọn văn bản rồi nhấn Ctrl+C."]},"inaccurate":["Bản dịch đến từ Google Dịch, chính là dịch vụ tích hợp trong Chrome.","Với khóa AI của riêng bạn, cửa sổ dịch sẽ giải thích ý nghĩa, giọng điệu và ngữ cảnh của những câu khó."],"not_needed":["Cảm ơn bạn đã dùng thử. Hãy quay lại khi bạn cần dịch."],"langAsk":"Bạn cần ngôn ngữ nào?","langPick":"Chọn ngôn ngữ…","langOther":"Khác","langSend":"Gửi","langSent":"Cảm ơn bạn! Chúng tôi sẽ thêm: thứ tự ngôn ngữ mới dựa trên những câu trả lời như thế này.","langHint":"Kukuluku đã dịch sang 250 ngôn ngữ: menu → “Tất cả 250 ngôn ngữ” → tìm kiếm.","reinstall":"Cài đặt lại","note":"Chúng tôi làm Kukuluku để việc đọc bằng bất kỳ ngôn ngữ nào cũng trở nên đơn giản. Mỗi câu trả lời cho chúng tôi biết cần cải thiện điều gì trước. Cảm ơn bạn đã dành một phút.","again":"Đổi ý? Cài đặt lại","slow":["Tốc độ phụ thuộc vào kết nối internet và lượng văn bản trên trang.","Nếu chỉ cần một đoạn, hãy chọn đoạn đó - bản dịch sẽ hiện bên cạnh, không cần dịch cả trang."],"menuAsk":"Bạn cần menu bằng ngôn ngữ nào?","menuHint":"Hiện menu Kukuluku có 21 ngôn ngữ. Còn dịch thì Kukuluku dịch được sang 250 ngôn ngữ.","hard":{"lead":"Chỉ cần nhớ ba thao tác:","list":["Chọn văn bản bằng chuột - bản dịch sẽ hiện bên cạnh.","Giữ Alt+Q - cả trang chuyển sang ngôn ngữ của bạn. Thả ra - lại thấy bản gốc.","Giữ Alt và trỏ chuột vào một đoạn văn - bản dịch sẽ hiện bên dưới."]},"hotkey":["Hiện chưa thể đổi phím tắt Alt+Q.","Câu trả lời của bạn cho chúng tôi biết rằng cần có cách tự chọn phím tắt."],"annoying":{"lead":"Bạn có thể điều chỉnh mà không cần gỡ:","list":["Chỉ dịch khi nhấn phím: trong menu, ở mục “Hiện bản dịch”, chọn “Alt+Q”. Khi đó, chỉ chọn văn bản sẽ không hiện gì.","Tắt trên một trang: ở màn hình chính của menu, chuyển sang “không dịch ở đây”.","Tạm dừng: trong menu, ở “Tạm dừng”, chọn 15 phút, 1 giờ, đến ngày mai hoặc đến khi bạn bật lại."]},"textLabel":"Hãy mô tả điều gì chưa ổn","textPlaceholder":"Càng chi tiết, chúng tôi càng hiểu rõ cần sửa gì: điều gì gây bất tiện, trên trang web nào, vào lúc nào.","send":"Gửi","sentNote":"Đã gửi câu trả lời.","mailLabel":"Email để chúng tôi trả lời","mailHint":"Để lại email, chúng tôi sẽ viết cho bạn khi đã xem xét xong.","mailBad":"Có vẻ địa chỉ bị gõ nhầm.","sentMail":"Đã gửi câu trả lời. Chúng tôi sẽ trả lời bạn qua email."},
    "id": {"title":"Kukuluku telah dihapus","ask":"Mengapa Anda menghapusnya? Centang semua yang sesuai agar kami tahu apa yang perlu diperbaiki.","reasons":["Terjemahan tidak muncul","Bahasa saya tidak ada","Terjemahannya salah","Tidak diperlukan lagi","Terjemahannya lambat","Menu tidak dalam bahasa saya","Sulit dipahami","Pintasan Alt+Q tidak nyaman","Mengganggu di situs web"],"thanks":"Terima kasih! Ini sangat membantu.","no_translation":{"lead":"Biasanya karena salah satu dari tiga hal ini:","list":["Itu halaman Chrome. Chrome tidak mengizinkan ekstensi di Chrome Web Store, setelan, dan halaman tab baru. Buka situs apa pun dan pilih teks di sana.","Teks sudah dalam bahasa terjemahan Anda: misalnya situs berbahasa Inggris dan terjemahan ke bahasa Inggris. Tidak ada yang perlu diterjemahkan, jadi jendela tidak muncul. Pilih bahasa Anda di menu.","Itu Google Dokumen, Spreadsheet, atau PDF. Di sana, pilih teks lalu tekan Ctrl+C."]},"inaccurate":["Terjemahan berasal dari Google Terjemahan, yang sama dengan yang ada di Chrome.","Dengan kunci AI Anda sendiri, jendela terjemahan menjelaskan makna, nada, dan konteks kalimat yang sulit."],"not_needed":["Terima kasih sudah mencoba. Kembalilah saat Anda memerlukan terjemahan."],"langAsk":"Bahasa apa yang Anda perlukan?","langPick":"Pilih bahasa…","langOther":"Lainnya","langSend":"Kirim","langSent":"Terima kasih! Kami akan menambahkannya: urutan bahasa baru kami susun dari jawaban seperti ini.","langHint":"Kukuluku sudah menerjemahkan ke 250 bahasa: menu → “Semua 250 bahasa” → pencarian.","reinstall":"Pasang lagi","note":"Kami membuat Kukuluku agar membaca dalam bahasa apa pun terasa mudah. Setiap jawaban menunjukkan apa yang perlu kami perbaiki lebih dulu. Terima kasih sudah meluangkan waktu sebentar.","again":"Berubah pikiran? Pasang lagi","slow":["Kecepatannya bergantung pada internet dan seberapa banyak teks di halaman.","Jika hanya perlu sebagian, pilih bagian itu: terjemahan muncul di sebelahnya, tanpa menerjemahkan seluruh halaman."],"menuAsk":"Dalam bahasa apa Anda memerlukan menu?","menuHint":"Saat ini menu Kukuluku tersedia dalam 21 bahasa. Kukuluku bisa menerjemahkan ke 250 bahasa.","hard":{"lead":"Intinya tiga gerakan:","list":["Pilih teks dengan mouse: terjemahan muncul di sebelahnya.","Tahan Alt+Q: seluruh halaman tampil dalam bahasa Anda. Lepaskan: teks asli kembali.","Tahan Alt dan arahkan mouse ke paragraf: terjemahan muncul di bawahnya."]},"hotkey":["Untuk saat ini pintasan Alt+Q belum bisa diubah.","Jawaban Anda memberi tahu kami bahwa pilihan pintasan sendiri memang dibutuhkan."],"annoying":{"lead":"Ini bisa diatur tanpa menghapus:","list":["Terjemahan hanya lewat pintasan: di menu, pada “Tampilkan terjemahan”, pilih “Alt+Q”. Dengan begitu, memilih teks saja tidak menampilkan apa pun.","Matikan di satu situs: di layar utama menu, ubah ke “tidak menerjemahkan di sini”.","Jeda: di menu, pada “Jeda”, pilih 15 menit, 1 jam, sampai besok, atau sampai Anda menyalakannya lagi."]},"textLabel":"Ceritakan apa yang kurang beres","textPlaceholder":"Semakin rinci, semakin tepat kami memahami apa yang perlu diperbaiki: apa yang mengganggu, di situs mana, pada saat apa.","send":"Kirim","sentNote":"Jawaban Anda telah terkirim.","mailLabel":"Email untuk balasan","mailHint":"Tinggalkan email Anda, dan kami akan membalas setelah memeriksanya.","mailBad":"Sepertinya ada salah ketik di alamat ini.","sentMail":"Jawaban Anda telah terkirim. Kami akan membalas lewat email."},
    "ms": {"title":"Kukuluku telah dialih keluar","ask":"Mengapa anda mengalih keluarnya? Tandakan semua yang berkaitan: ini membantu kami tahu apa yang perlu dibaiki.","reasons":["Terjemahan tidak muncul","Bahasa saya tiada","Terjemahan ada kesilapan","Tidak diperlukan lagi","Terjemahan lambat","Menu bukan dalam bahasa saya","Sukar difahami","Kekunci Alt+Q tidak selesa","Mengganggu di laman web"],"thanks":"Terima kasih! Ini sangat membantu.","no_translation":{"lead":"Biasanya ia salah satu daripada tiga perkara ini:","list":["Itu halaman Chrome. Chrome tidak membenarkan sambungan di Chrome Web Store, tetapan dan halaman tab baharu. Buka mana-mana laman web dan pilih teks di sana.","Teks sudah dalam bahasa terjemahan anda: contohnya laman bahasa Inggeris dan terjemahan ke bahasa Inggeris. Tiada apa untuk diterjemahkan, jadi tetingkap tidak muncul. Pilih bahasa anda dalam menu.","Itu Google Dokumen, Helaian atau PDF. Di sana, pilih teks dan tekan Ctrl+C."]},"inaccurate":["Terjemahan datang daripada Google Terjemah, yang sama seperti terbina dalam Chrome.","Dengan kunci AI anda sendiri, tetingkap terjemahan menerangkan maksud, nada dan konteks ayat yang sukar."],"not_needed":["Terima kasih kerana mencuba. Kembalilah apabila anda memerlukan terjemahan."],"langAsk":"Bahasa apa yang anda perlukan?","langPick":"Pilih bahasa…","langOther":"Lain-lain","langSend":"Hantar","langSent":"Terima kasih! Kami akan menambahkannya: susunan bahasa baharu ditentukan oleh jawapan seperti ini.","langHint":"Kukuluku sudah menterjemah ke 250 bahasa: menu → “All 250 languages” → carian.","reinstall":"Pasang semula","note":"Kami membina Kukuluku supaya mudah membaca dalam apa jua bahasa. Setiap jawapan menunjukkan apa yang perlu kami perbaiki dahulu. Terima kasih kerana sudi meluangkan masa.","again":"Ubah fikiran? Pasang semula","slow":["Kelajuan bergantung pada internet dan jumlah teks pada halaman.","Jika anda hanya perlukan sebahagian, pilih bahagian itu sahaja: terjemahan muncul di sebelahnya tanpa menterjemah seluruh halaman."],"menuAsk":"Menu dalam bahasa apa yang anda perlukan?","menuHint":"Menu Kukuluku kini ada dalam 21 bahasa. Ia boleh menterjemah ke 250 bahasa.","hard":{"lead":"Yang utama, hanya tiga gerakan:","list":["Pilih teks dengan tetikus: terjemahan muncul di sebelahnya.","Tahan Alt+Q: seluruh halaman dalam bahasa anda. Lepaskan, dan teks asal kembali.","Tahan Alt dan halakan tetikus ke perenggan: terjemahan muncul di bawahnya."]},"hotkey":["Buat masa ini, kekunci Alt+Q belum boleh ditukar.","Jawapan anda memberitahu kami bahawa pilihan kekunci sendiri memang diperlukan."],"annoying":{"lead":"Ini boleh dilaraskan tanpa mengalih keluarnya:","list":["Terjemah hanya dengan kekunci: dalam menu, pada “Show translation”, pilih “Alt+Q”. Dengan itu, memilih teks sahaja tidak memaparkan apa-apa.","Matikan pada satu laman: pada skrin utama menu, pilih “not translating here”.","Jeda: dalam menu, pada “Pause”, pilih 15 minit, sejam, hingga esok atau sehingga anda menghidupkannya semula."]},"textLabel":"Ceritakan apa yang tidak kena","textPlaceholder":"Semakin terperinci, semakin jelas bagi kami apa yang perlu dibaiki: apa yang mengganggu, di laman web mana dan bila ia berlaku.","send":"Hantar","sentNote":"Jawapan telah dihantar.","mailLabel":"E-mel untuk balasan","mailHint":"Tinggalkan e-mel anda dan kami akan membalas selepas menyemaknya.","mailBad":"Nampaknya ada kesilapan taip dalam alamat ini.","sentMail":"Jawapan telah dihantar. Kami akan membalas melalui e-mel."},
    "tl": {"title":"Naalis na ang Kukuluku","ask":"Bakit mo ito inalis? Piliin ang lahat ng naaangkop para malaman namin kung ano ang aayusin.","reasons":["Hindi lumabas ang pagsasalin","Wala ang wika ko","May mali sa pagsasalin","Hindi ko na kailangan","Mabagal magsalin","Wala sa wika ko ang menu","Mahirap maintindihan","Hindi komportable ang Alt+Q","Nakakaabala sa mga site"],"thanks":"Salamat! Malaking tulong ito.","no_translation":{"lead":"Kadalasan, isa ito sa tatlong bagay na ito:","list":["Pahina ito ng Chrome. Hindi pinapayagan ng Chrome ang mga extension sa Chrome Web Store, settings, at bagong tab. Magbukas ng kahit anong website at doon pumili ng teksto.","Nasa wika ng pagsasalin mo na ang teksto: halimbawa, site na Ingles at pagsasalin sa Ingles. Walang isasalin kaya hindi lumalabas ang window. Piliin ang sarili mong wika sa menu.","Google Docs, Sheets, o PDF ito. Doon, piliin ang teksto at pindutin ang Ctrl+C."]},"inaccurate":["Galing ang pagsasalin sa Google Translate, ang kaparehong nasa Chrome.","Gamit ang sarili mong AI key, ipapaliwanag ng window ng pagsasalin ang kahulugan, tono, at konteksto ng mahihirap na parirala."],"not_needed":["Salamat sa pagsubok. Bumalik ka kapag kailangan mo ulit ng pagsasalin."],"langAsk":"Anong wika ang kailangan mo?","langPick":"Pumili ng wika…","langOther":"Iba pa","langSend":"Ipadala","langSent":"Salamat! Idadagdag namin ito: ang mga ganitong sagot ang batayan ng pagkakasunod-sunod ng mga bagong wika.","langHint":"Nakakapagsalin na ang Kukuluku sa 250 wika: menu → “All 250 languages” → hanapin.","reinstall":"I-install muli","note":"Ginagawa namin ang Kukuluku para madali ang pagbabasa sa kahit anong wika. Bawat sagot ay nagpapakita kung ano ang dapat unahing pagbutihin. Salamat sa oras mo.","again":"Nagbago ang isip? I-install muli","slow":["Nakadepende ang bilis sa internet at sa dami ng teksto sa pahina.","Kung bahagi lang ang kailangan mo, iyon lang ang piliin: lalabas ang pagsasalin sa tabi nito nang hindi isinasalin ang buong pahina."],"menuAsk":"Sa anong wika mo kailangan ang menu?","menuHint":"Nasa 21 wika ngayon ang menu ng Kukuluku. Nakakapagsalin naman ito sa 250 wika.","hard":{"lead":"Tatlong galaw lang ang mahalaga:","list":["Pumili ng teksto gamit ang mouse: lalabas ang pagsasalin sa tabi nito.","Pindutin nang matagal ang Alt+Q: nasa wika mo ang buong pahina. Bitawan, at babalik ang orihinal.","Pindutin nang matagal ang Alt at itapat ang mouse sa isang talata: lalabas ang pagsasalin sa ilalim nito."]},"hotkey":["Sa ngayon, hindi pa mapapalitan ang Alt+Q.","Ipinapakita sa amin ng sagot mo na kailangan ang pagpili ng sariling key."],"annoying":{"lead":"Maaari itong ayusin nang hindi inaalis:","list":["Pagsasalin gamit lang ang key: sa menu, sa “Show translation”, piliin ang “Alt+Q”. Sa ganoon, walang lalabas kapag pumili ka lang ng teksto.","Patayin sa isang site: sa pangunahing screen ng menu, piliin ang “not translating here”.","Pansamantalang ihinto: sa menu, sa “Pause”, pumili ng 15 minuto, isang oras, hanggang bukas, o hanggang i-on mo ulit."]},"textLabel":"Ikuwento kung ano ang naging problema","textPlaceholder":"Mas detalyado, mas malinaw sa amin kung ano ang aayusin: ano ang nakaabala, sa aling site, at kailan ito nangyari.","send":"Ipadala","sentNote":"Naipadala na ang sagot.","mailLabel":"Email para sa sagot","mailHint":"Iwan mo ito, at susulatan ka namin kapag natingnan na namin ang problema.","mailBad":"Mukhang may typo sa address.","sentMail":"Naipadala na ang sagot. Susulatan ka namin sa email."},
    "ja": {"title":"Kukuluku を削除しました","ask":"削除した理由を教えてください。当てはまるものをすべて選んでいただくと、直すべき点がわかります。","reasons":["翻訳が表示されなかった","自分の言語がない","翻訳に誤りがあった","もう必要ない","翻訳が遅い","メニューが自分の言語ではない","使い方がわかりにくい","Alt+Q キーが使いにくい","サイトの邪魔になる"],"thanks":"ありがとうございます。とても助かります。","no_translation":{"lead":"原因はたいてい次の3つのどれかです。","list":["Chrome の専用ページでした。Chrome ウェブストア、設定、新しいタブでは、Chrome がすべての拡張機能を止めています。普通のサイトを開いて、そこでテキストを選択してください。","テキストがすでに翻訳先の言語でした。たとえば英語のサイトを英語に翻訳する場合です。翻訳するものがないので、ウィンドウは出ません。メニューで自分の言語を選んでください。","Google ドキュメント、スプレッドシート、PDF でした。これらではテキストを選択して Ctrl+C を押してください。"]},"inaccurate":["翻訳には、Chrome に組み込まれているものと同じ Google 翻訳を使っています。","ご自身の AI キーがあれば、翻訳ウィンドウが難しい表現の意味、トーン、文脈を説明します。"],"not_needed":["お試しいただきありがとうございました。また翻訳が必要なときにお戻りください。"],"langAsk":"どの言語が必要ですか？","langPick":"言語を選択…","langOther":"その他","langSend":"送信","langSent":"ありがとうございます。追加します。新しい言語の順番は、こうした回答で決めています。","langHint":"Kukuluku はすでに 250 言語に翻訳できます：メニュー → 「全250言語」 → 検索。","reinstall":"もう一度インストール","note":"私たちは、どんな言語でもかんたんに読めるように Kukuluku をつくっています。一つひとつの回答が、まず何を良くすべきかを教えてくれます。お時間をいただき、ありがとうございます。","again":"気が変わりましたか？もう一度インストール","slow":["速さは、インターネットの状況とページ上の文字量によって変わります。","一部だけ必要なら、その部分を選択してください。ページ全体を翻訳しなくても、そのそばに翻訳が表示されます。"],"menuAsk":"どの言語のメニューが必要ですか？","menuHint":"Kukuluku のメニューは今のところ 21 言語に対応しています。翻訳できるのは 250 言語です。","hard":{"lead":"大事なのは、次の3つの操作だけです。","list":["マウスでテキストを選択すると、そのそばに翻訳が表示されます。","Alt+Q を長押しすると、ページ全体があなたの言語で表示されます。離すと元に戻ります。","Alt を押したままマウスで段落を指すと、その下に翻訳が表示されます。"]},"hotkey":["今のところ、Alt+Q キーは変更できません。","いただいた回答から、キーを自分で選べる機能が必要だとわかります。"],"annoying":{"lead":"削除しなくても、次のように設定できます。","list":["キーを押したときだけ翻訳：メニューの「翻訳の表示」で「Alt+Q」を選んでください。テキストを選択しただけでは何も表示されなくなります。","特定のサイトだけオフ：メニューのメイン画面で「このサイトでは翻訳しません」を選んでください。","一時停止：メニューの「一時停止」で、15分間、1時間、明日まで、またはオンにするまでを選べます。"]},"textLabel":"うまくいかなかった点を教えてください","textPlaceholder":"詳しく書いていただくほど、直すべき点が正確にわかります。何が不便だったか、どのサイトで、どんなときに起きたかなど。","send":"送信","sentNote":"回答を送信しました。","mailLabel":"返信先のメールアドレス","mailHint":"入力していただければ、確認したうえでご連絡します。","mailBad":"アドレスに入力ミスがあるようです。","sentMail":"回答を送信しました。メールでご連絡します。"},
    "ko": {"title":"Kukuluku가 삭제되었습니다","ask":"왜 삭제하셨나요? 해당하는 항목을 모두 선택해 주세요. 무엇을 고쳐야 할지 알 수 있습니다.","reasons":["번역이 나타나지 않음","내 언어가 없음","번역에 오류가 있음","더 이상 필요 없음","번역이 느림","메뉴에 내 언어가 없음","사용법이 어려움","Alt+Q 키가 불편함","사이트에서 방해가 됨"],"thanks":"감사합니다! 정말 도움이 됩니다.","no_translation":{"lead":"보통 다음 세 가지 중 하나입니다.","list":["Chrome 전용 페이지였습니다. Chrome은 Chrome 웹 스토어, 설정, 새 탭 페이지에서 모든 확장 프로그램을 막습니다. 아무 웹사이트나 열고 거기서 텍스트를 선택하세요.","텍스트가 이미 번역 언어였습니다. 예를 들어 영어 사이트를 영어로 번역하는 경우입니다. 번역할 내용이 없어 창이 나타나지 않습니다. 메뉴에서 내 언어를 선택하세요.","Google 문서, 스프레드시트 또는 PDF였습니다. 여기서는 텍스트를 선택하고 Ctrl+C를 누르세요."]},"inaccurate":["번역은 Chrome에 내장된 것과 같은 Google 번역을 사용합니다.","내 AI 키가 있으면 번역 창이 어려운 표현의 의미, 어조, 맥락을 설명해 줍니다."],"not_needed":["사용해 주셔서 감사합니다. 번역이 필요할 때 다시 찾아 주세요."],"langAsk":"어떤 언어가 필요하신가요?","langPick":"언어 선택…","langOther":"기타","langSend":"보내기","langSent":"감사합니다! 추가하겠습니다. 새 언어의 순서는 이런 답변으로 정합니다.","langHint":"Kukuluku는 이미 250개 언어로 번역합니다: 메뉴 → “전체 250개 언어” → 검색.","reinstall":"다시 설치","note":"저희는 어떤 언어든 쉽게 읽을 수 있도록 Kukuluku를 만들고 있습니다. 답변 하나하나가 무엇을 먼저 개선해야 할지 알려 줍니다. 시간 내 주셔서 감사합니다.","again":"마음이 바뀌셨나요? 다시 설치","slow":["속도는 인터넷 상태와 페이지의 텍스트 양에 따라 달라집니다.","일부만 필요하면 그 부분만 선택하세요. 페이지 전체를 번역하지 않아도 그 옆에 번역이 나타납니다."],"menuAsk":"어떤 언어로 된 메뉴가 필요하신가요?","menuHint":"현재 Kukuluku 메뉴는 21개 언어로 제공됩니다. 번역은 250개 언어로 할 수 있습니다.","hard":{"lead":"핵심은 세 가지 동작입니다.","list":["마우스로 텍스트를 선택하면 그 옆에 번역이 나타납니다.","Alt+Q를 길게 누르면 페이지 전체가 내 언어로 바뀝니다. 손을 떼면 다시 원문이 보입니다.","Alt를 누른 채 마우스로 문단을 가리키면 그 아래에 번역이 나타납니다."]},"hotkey":["아직은 Alt+Q 키를 바꿀 수 없습니다.","보내 주신 답변으로 원하는 키를 고르는 기능이 필요하다는 것을 알 수 있습니다."],"annoying":{"lead":"삭제하지 않고도 설정으로 바꿀 수 있습니다.","list":["키를 누를 때만 번역: 메뉴의 “번역 표시”에서 “Alt+Q”를 선택하세요. 그러면 텍스트를 선택하기만 해서는 아무것도 나타나지 않습니다.","한 사이트에서만 끄기: 메뉴 첫 화면에서 “여기서는 번역하지 않음”을 선택하세요.","일시 중지: 메뉴의 “일시 중지”에서 15분, 1시간, 내일까지, 다시 켤 때까지 중 하나를 고르세요."]},"textLabel":"어떤 점이 불편하셨는지 알려 주세요","textPlaceholder":"자세히 적어 주실수록 무엇을 고쳐야 할지 더 정확히 알 수 있습니다. 무엇이 불편했는지, 어느 사이트에서, 어떤 순간이었는지 적어 주세요.","send":"보내기","sentNote":"답변을 보냈습니다.","mailLabel":"답장 받을 이메일","mailHint":"남겨 주시면 확인한 뒤 연락드리겠습니다.","mailBad":"주소에 오타가 있는 것 같습니다.","sentMail":"답변을 보냈습니다. 이메일로 연락드리겠습니다."},
    "zh": {"title":"Kukuluku 已移除","ask":"您为什么移除它？请勾选所有符合的选项，这样我们就知道该修什么。","reasons":["没有出现翻译","没有我的语言","翻译有错误","不再需要","翻译速度慢","菜单没有我的语言","很难上手","Alt+Q 快捷键不方便","干扰网页浏览"],"thanks":"谢谢！这真的很有帮助。","no_translation":{"lead":"通常是以下三种情况之一：","list":["这是 Chrome 专用页面。Chrome 不允许任何扩展程序在 Chrome 应用商店、设置和新标签页中运行。请打开任意网站，在那里选择文字。","文字已经是您的翻译语言：例如英文网站翻译成英文。没有需要翻译的内容，所以不会出现窗口。请在菜单中选择您的语言。","这是 Google 文档、表格或 PDF。在这些地方，请选择文字并按 Ctrl+C。"]},"inaccurate":["翻译来自 Google 翻译，与 Chrome 内置的相同。","使用您自己的 AI 密钥，翻译窗口可以解释难句的含义、语气和语境。"],"not_needed":["感谢您的试用。需要翻译时欢迎回来。"],"langAsk":"您需要哪种语言？","langPick":"选择语言…","langOther":"其他","langSend":"发送","langSent":"谢谢！我们会添加：新语言的先后顺序就由这样的回答决定。","langHint":"Kukuluku 已能翻译成 250 种语言：菜单 → “全部 250 种语言” → 搜索。","reinstall":"重新安装","note":"我们开发 Kukuluku，是为了让阅读任何语言都变得简单。每一条反馈都在告诉我们，应该先改进什么。感谢您抽出这一分钟。","again":"改变主意了？重新安装","slow":["速度取决于网络状况和页面上的文字量。","如果只需要其中一部分，选中这部分即可：翻译会显示在旁边，无需翻译整个页面。"],"menuAsk":"您需要哪种语言的菜单？","menuHint":"Kukuluku 菜单目前有 21 种语言，可以翻译成 250 种语言。","hard":{"lead":"关键只有三个动作：","list":["用鼠标选中文字，翻译就会显示在旁边。","按住 Alt+Q，整个页面就会变成您的语言；松开后恢复原文。","按住 Alt 并用鼠标指向段落，翻译会显示在段落下方。"]},"hotkey":["目前还无法更改 Alt+Q 快捷键。","您的回答会告诉我们：确实需要能自选快捷键。"],"annoying":{"lead":"不用移除，也可以这样设置：","list":["只在按键时翻译：在菜单的“显示翻译”中选择“Alt+Q”。这样，仅选中文字时不会显示任何内容。","在某个网站关闭：在菜单主界面选择“此网站不翻译”。","暂停：在菜单的“暂停”中，可选择 15 分钟、1 小时、到明天，或直到您重新开启。"]},"textLabel":"请告诉我们哪里出了问题","textPlaceholder":"写得越详细，我们越能准确找到要修的地方：哪里不好用、在哪个网站、什么时候。","send":"发送","sentNote":"反馈已发送。","mailLabel":"接收回复的邮箱","mailHint":"留下邮箱，问题查清后我们会给您回信。","mailBad":"地址好像输错了。","sentMail":"反馈已发送。我们会通过邮件回复您。"},
    "zh-tw": {"title":"Kukuluku 已移除","ask":"您為什麼移除它？請勾選所有符合的選項，這樣我們就知道該修什麼。","reasons":["沒有出現翻譯","沒有我的語言","翻譯有錯誤","不再需要","翻譯速度慢","選單沒有我的語言","很難上手","Alt+Q 快捷鍵不方便","干擾網頁瀏覽"],"thanks":"謝謝！這真的很有幫助。","no_translation":{"lead":"通常是以下三種情況之一：","list":["這是 Chrome 專用頁面。Chrome 不允許任何擴充功能在 Chrome 線上應用程式商店、設定和新分頁中執行。請開啟任何網站，在那裡選取文字。","文字已經是您的翻譯語言：例如英文網站翻譯成英文。沒有需要翻譯的內容，所以不會出現視窗。請在選單中選擇您的語言。","這是 Google 文件、試算表或 PDF。在這些地方，請選取文字並按 Ctrl+C。"]},"inaccurate":["翻譯來自 Google 翻譯，與 Chrome 內建的相同。","使用您自己的 AI 金鑰，翻譯視窗可以解釋難句的含義、語氣和語境。"],"not_needed":["感謝您的試用。需要翻譯時歡迎回來。"],"langAsk":"您需要哪種語言？","langPick":"選擇語言…","langOther":"其他","langSend":"傳送","langSent":"謝謝！我們會加入：新語言的先後順序就由這樣的回答決定。","langHint":"Kukuluku 已能翻譯成 250 種語言：選單 → 「全部 250 種語言」 → 搜尋。","reinstall":"重新安裝","note":"我們開發 Kukuluku，是為了讓閱讀任何語言都變得簡單。每一則意見都在告訴我們，應該先改進什麼。感謝您撥空填寫。","again":"改變主意了？重新安裝","slow":["速度取決於網路狀況和頁面上的文字量。","如果只需要其中一部分，選取這部分即可：翻譯會顯示在旁邊，不必翻譯整個頁面。"],"menuAsk":"您需要哪種語言的選單？","menuHint":"Kukuluku 選單目前有 21 種語言，可以翻譯成 250 種語言。","hard":{"lead":"關鍵只有三個動作：","list":["用滑鼠選取文字，翻譯就會顯示在旁邊。","按住 Alt+Q，整個頁面就會變成您的語言；放開後恢復原文。","按住 Alt 並用滑鼠指向段落，翻譯會顯示在段落下方。"]},"hotkey":["目前還無法變更 Alt+Q 快捷鍵。","您的回答會告訴我們：確實需要能自選快捷鍵。"],"annoying":{"lead":"不用移除，也可以這樣設定：","list":["只在按鍵時翻譯：在選單的「顯示翻譯」中選擇「Alt+Q」。這樣，僅選取文字時不會顯示任何內容。","在某個網站關閉：在選單主畫面選擇「此網站不翻譯」。","暫停：在選單的「暫停」中，可選擇 15 分鐘、1 小時、到明天，或直到您重新開啟。"]},"textLabel":"請告訴我們哪裡出了問題","textPlaceholder":"寫得越詳細，我們越能準確找到要修正的地方：哪裡不好用、在哪個網站、什麼時候。","send":"傳送","sentNote":"意見已送出。","mailLabel":"接收回覆的電子郵件","mailHint":"留下電子郵件，問題查清楚後我們會回信給您。","mailBad":"地址好像打錯了。","sentMail":"意見已送出。我們會透過電子郵件回覆您。"},
    "th": {"title":"ลบ Kukuluku แล้ว","ask":"ทำไมคุณจึงลบ? เลือกทุกข้อที่ตรงกับคุณ เพื่อให้เรารู้ว่าควรแก้อะไร","reasons":["คำแปลไม่ปรากฏ","ไม่มีภาษาของฉัน","คำแปลมีข้อผิดพลาด","ไม่ต้องการแล้ว","แปลช้า","เมนูไม่มีภาษาของฉัน","เข้าใจวิธีใช้ยาก","ปุ่ม Alt+Q ใช้ไม่สะดวก","รบกวนเวลาใช้เว็บ"],"thanks":"ขอบคุณ! สิ่งนี้ช่วยเราได้มาก","no_translation":{"lead":"โดยปกติมักเป็นหนึ่งในสามเรื่องนี้:","list":["นั่นคือหน้าของ Chrome ซึ่ง Chrome ไม่อนุญาตให้ส่วนขยายทำงานใน Chrome เว็บสโตร์ การตั้งค่า และหน้าแท็บใหม่ โปรดเปิดเว็บไซต์ใดก็ได้แล้วเลือกข้อความที่นั่น","ข้อความเป็นภาษาที่คุณแปลอยู่แล้ว เช่น เว็บไซต์ภาษาอังกฤษและแปลเป็นภาษาอังกฤษ จึงไม่มีอะไรให้แปลและหน้าต่างไม่ปรากฏ โปรดเลือกภาษาของคุณในเมนู","นั่นคือ Google เอกสาร ชีต หรือ PDF ในกรณีนี้ให้เลือกข้อความแล้วกด Ctrl+C"]},"inaccurate":["คำแปลมาจาก Google แปลภาษา ตัวเดียวกับที่มีใน Chrome","เมื่อใช้คีย์ AI ของคุณเอง หน้าต่างแปลจะอธิบายความหมาย น้ำเสียง และบริบทของประโยคที่ยากได้"],"not_needed":["ขอบคุณที่ลองใช้ กลับมาได้เสมอเมื่อต้องการคำแปล"],"langAsk":"คุณต้องการภาษาอะไร?","langPick":"เลือกภาษา…","langOther":"อื่นๆ","langSend":"ส่ง","langSent":"ขอบคุณ! เราจะเพิ่มให้ ลำดับภาษาใหม่มาจากคำตอบแบบนี้","langHint":"Kukuluku แปลได้แล้ว 250 ภาษา: เมนู → “ทุกภาษา · 250” → ค้นหา","reinstall":"ติดตั้งอีกครั้ง","note":"เราสร้าง Kukuluku เพื่อให้การอ่านทุกภาษาเป็นเรื่องง่าย ทุกคำตอบช่วยบอกเราว่าควรปรับปรุงอะไรก่อน ขอบคุณที่สละเวลา","again":"เปลี่ยนใจแล้วหรือ? ติดตั้งอีกครั้ง","slow":["ความเร็วขึ้นอยู่กับอินเทอร์เน็ตและปริมาณข้อความบนหน้าเว็บ","ถ้าต้องการแค่บางส่วน ให้เลือกเฉพาะส่วนนั้น คำแปลจะขึ้นข้างๆ โดยไม่ต้องแปลทั้งหน้า"],"menuAsk":"คุณต้องการเมนูภาษาอะไร?","menuHint":"ตอนนี้เมนู Kukuluku มี 21 ภาษา ส่วนการแปลทำได้ 250 ภาษา","hard":{"lead":"หลักๆ มีแค่สามท่า:","list":["ใช้เมาส์เลือกข้อความ คำแปลจะขึ้นข้างๆ","กด Alt+Q ค้างไว้ ทั้งหน้าจะเป็นภาษาของคุณ ปล่อยแล้วจะกลับเป็นต้นฉบับ","กด Alt ค้างแล้วชี้เมาส์ที่ย่อหน้า คำแปลจะขึ้นใต้ย่อหน้านั้น"]},"hotkey":["ตอนนี้ยังเปลี่ยนปุ่ม Alt+Q ไม่ได้","คำตอบของคุณช่วยบอกเราว่าควรมีตัวเลือกให้กำหนดปุ่มเอง"],"annoying":{"lead":"ตั้งค่าได้โดยไม่ต้องลบ:","list":["แปลเฉพาะเมื่อกดปุ่ม: ในเมนู ที่ “แสดงคำแปล” ให้เลือก “Alt+Q” แล้วการเลือกข้อความอย่างเดียวจะไม่แสดงอะไร","ปิดเฉพาะเว็บเดียว: ที่หน้าหลักของเมนู ให้เลือก “ไม่แปลในเว็บนี้”","หยุดชั่วคราว: ในเมนู ที่ “หยุดชั่วคราว” เลือกได้ 15 นาที, 1 ชั่วโมง, ถึงพรุ่งนี้ หรือจนกว่าจะเปิดเอง"]},"textLabel":"เล่าให้เราฟังว่าเกิดปัญหาอะไร","textPlaceholder":"ยิ่งเล่าละเอียด เรายิ่งเข้าใจได้แม่นยำว่าต้องแก้อะไร เช่น อะไรที่ไม่สะดวก บนเว็บไหน และตอนไหน","send":"ส่ง","sentNote":"ส่งคำตอบแล้ว","mailLabel":"อีเมลสำหรับตอบกลับ","mailHint":"ใส่อีเมลไว้ แล้วเราจะตอบกลับเมื่อตรวจสอบแล้ว","mailBad":"ดูเหมือนที่อยู่อีเมลจะพิมพ์ผิด","sentMail":"ส่งคำตอบแล้ว เราจะตอบกลับทางอีเมล"},
    "hi": {"title":"Kukuluku हटा दिया गया","ask":"आपने इसे क्यों हटाया? जो भी लागू हों, सब चुनें: इससे हमें पता चलेगा कि क्या ठीक करना है।","reasons":["अनुवाद नहीं दिखा","मेरी भाषा नहीं है","अनुवाद में गलतियाँ थीं","अब ज़रूरत नहीं","अनुवाद धीमा है","मेनू मेरी भाषा में नहीं","समझना मुश्किल है","Alt+Q कुंजी असुविधाजनक है","साइटों पर परेशान करता है"],"thanks":"धन्यवाद! इससे सच में मदद मिलती है।","no_translation":{"lead":"आमतौर पर इन तीन में से कोई एक वजह होती है:","list":["यह Chrome का अपना पेज था। Chrome वेब स्टोर, सेटिंग्स और नए टैब पेज पर Chrome किसी भी एक्सटेंशन को नहीं चलने देता। कोई भी वेबसाइट खोलें और वहाँ टेक्स्ट चुनें।","टेक्स्ट पहले से आपकी अनुवाद की भाषा में था: जैसे अंग्रेज़ी साइट और अंग्रेज़ी में अनुवाद। अनुवाद करने को कुछ नहीं था, इसलिए विंडो नहीं दिखी। मेनू में अपनी भाषा चुनें।","यह Google Docs, Sheets या PDF था। वहाँ टेक्स्ट चुनें और Ctrl+C दबाएँ।"]},"inaccurate":["अनुवाद Google Translate से आता है, वही जो Chrome में शामिल है।","अपनी AI कुंजी से अनुवाद विंडो कठिन वाक्यों का अर्थ, लहजा और संदर्भ समझाती है।"],"not_needed":["आज़माने के लिए धन्यवाद। जब फिर अनुवाद की ज़रूरत हो, तो वापस आएँ।"],"langAsk":"आपको कौन सी भाषा चाहिए?","langPick":"भाषा चुनें…","langOther":"अन्य","langSend":"भेजें","langSent":"धन्यवाद! हम इसे जोड़ेंगे: नई भाषाओं का क्रम ऐसे ही जवाबों से तय होता है।","langHint":"Kukuluku पहले से 250 भाषाओं में अनुवाद करता है: मेनू → “सभी भाषाएँ · 250” → खोज।","reinstall":"फिर से इंस्टॉल करें","note":"हम Kukuluku इसलिए बनाते हैं ताकि किसी भी भाषा में पढ़ना आसान हो। हर जवाब बताता है कि पहले क्या बेहतर करना है। एक मिनट निकालने के लिए धन्यवाद।","again":"मन बदल गया? फिर से इंस्टॉल करें","slow":["गति आपके इंटरनेट और पेज पर मौजूद टेक्स्ट की मात्रा पर निर्भर करती है।","अगर सिर्फ़ एक हिस्सा चाहिए, तो वही हिस्सा चुनें: अनुवाद उसके पास दिखेगा, पूरे पेज का अनुवाद किए बिना।"],"menuAsk":"मेनू आपको किस भाषा में चाहिए?","menuHint":"Kukuluku का मेनू अभी 21 भाषाओं में है। अनुवाद यह 250 भाषाओं में कर सकता है।","hard":{"lead":"सबसे ज़रूरी हैं ये तीन तरीके:","list":["माउस से टेक्स्ट चुनें: अनुवाद उसके पास दिखेगा।","Alt+Q दबाए रखें: पूरा पेज आपकी भाषा में दिखेगा। छोड़ने पर फिर से मूल पेज दिखेगा।","Alt दबाए रखें और माउस को पैराग्राफ़ पर ले जाएँ: अनुवाद उसके नीचे दिखेगा।"]},"hotkey":["अभी Alt+Q कुंजी बदली नहीं जा सकती।","आपके जवाब से हमें पता चलेगा कि अपनी कुंजी चुनने का विकल्प ज़रूरी है।"],"annoying":{"lead":"हटाए बिना भी इसे बदला जा सकता है:","list":["सिर्फ़ कुंजी से अनुवाद: मेनू में “अनुवाद दिखाएँ” के आगे “Alt+Q” चुनें। तब सिर्फ़ टेक्स्ट चुनने से कुछ नहीं दिखेगा।","किसी एक साइट पर बंद करें: मेनू की मुख्य स्क्रीन पर “यहाँ अनुवाद नहीं” चुनें।","कुछ देर रोकें: मेनू में “रोकें” के नीचे 15 मिनट, 1 घंटा, कल तक या दोबारा चालू करने तक में से कोई विकल्प चुनें।"]},"textLabel":"बताएँ कि क्या ठीक नहीं था","textPlaceholder":"आप जितना विस्तार से बताएँगे, हम उतना सटीक समझ पाएँगे कि क्या ठीक करना है: क्या परेशानी हुई, किस साइट पर और किस समय।","send":"भेजें","sentNote":"जवाब भेज दिया गया।","mailLabel":"जवाब के लिए ईमेल","mailHint":"अपना ईमेल दें, जाँच के बाद हम आपको लिखेंगे।","mailBad":"लगता है पते में टाइपिंग की ग़लती है।","sentMail":"जवाब भेज दिया गया। हम आपको ईमेल पर लिखेंगे।"},
    "bn": {"title":"Kukuluku সরানো হয়েছে","ask":"কেন সরালেন? প্রযোজ্য সবগুলো বেছে নিন: এতে আমরা বুঝব কী ঠিক করতে হবে।","reasons":["অনুবাদ দেখা যায়নি","আমার ভাষা নেই","অনুবাদে ভুল ছিল","আর দরকার নেই","অনুবাদ ধীরে হয়","মেনু আমার ভাষায় নয়","বুঝতে অসুবিধা হয়","Alt+Q কী অসুবিধাজনক","সাইটে ব্যাঘাত ঘটায়"],"thanks":"ধন্যবাদ! এটি সত্যিই সাহায্য করে।","no_translation":{"lead":"সাধারণত এই তিনটির একটি কারণ হয়:","list":["এটি Chrome-এর নিজস্ব পৃষ্ঠা ছিল। Chrome ওয়েব স্টোর, সেটিংস এবং নতুন ট্যাব পৃষ্ঠায় Chrome কোনো এক্সটেনশন চলতে দেয় না। যেকোনো ওয়েবসাইট খুলে সেখানে টেক্সট নির্বাচন করুন।","টেক্সট আগে থেকেই আপনার অনুবাদের ভাষায় ছিল: যেমন ইংরেজি সাইট এবং ইংরেজিতে অনুবাদ। অনুবাদ করার কিছু নেই, তাই উইন্ডো আসেনি। মেনুতে আপনার ভাষা বেছে নিন।","এটি Google Docs, Sheets বা PDF ছিল। সেখানে টেক্সট নির্বাচন করে Ctrl+C চাপুন।"]},"inaccurate":["অনুবাদ আসে Google Translate থেকে, যেটি Chrome-এ অন্তর্ভুক্ত।","আপনার নিজের AI কী দিয়ে অনুবাদ উইন্ডো কঠিন বাক্যের অর্থ, সুর ও প্রসঙ্গ ব্যাখ্যা করে।"],"not_needed":["ব্যবহার করে দেখার জন্য ধন্যবাদ। আবার অনুবাদ দরকার হলে ফিরে আসুন।"],"langAsk":"আপনার কোন ভাষা দরকার?","langPick":"ভাষা বেছে নিন…","langOther":"অন্যান্য","langSend":"পাঠান","langSent":"ধন্যবাদ! আমরা এটি যোগ করব: নতুন ভাষার ক্রম এমন উত্তর থেকেই ঠিক হয়।","langHint":"Kukuluku ইতিমধ্যে ২৫০টি ভাষায় অনুবাদ করে: মেনু → “All 250 languages” → অনুসন্ধান।","reinstall":"আবার ইনস্টল করুন","note":"যেকোনো ভাষায় পড়া সহজ করতেই আমরা Kukuluku বানাচ্ছি। প্রতিটি উত্তর দেখায় আগে কী উন্নত করতে হবে। এক মিনিট সময় দেওয়ার জন্য ধন্যবাদ।","again":"মত বদলেছেন? আবার ইনস্টল করুন","slow":["গতি নির্ভর করে ইন্টারনেট এবং পৃষ্ঠায় কতটা টেক্সট আছে তার ওপর।","শুধু একটি অংশ দরকার হলে সেটুকুই নির্বাচন করুন: পুরো পৃষ্ঠা অনুবাদ না করেই অনুবাদ পাশে দেখা যাবে।"],"menuAsk":"আপনার কোন ভাষায় মেনু দরকার?","menuHint":"Kukuluku-এর মেনু এখন ২১টি ভাষায় আছে। অনুবাদ করতে পারে ২৫০টি ভাষায়।","hard":{"lead":"মূলত তিনটি কাজ:","list":["মাউস দিয়ে টেক্সট নির্বাচন করুন: অনুবাদ পাশে দেখা যাবে।","Alt+Q চেপে ধরে রাখুন: পুরো পৃষ্ঠা আপনার
