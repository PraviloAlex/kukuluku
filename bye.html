<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kukuluku</title>
<style>
  :root {
    --page: #f4f1ea; --card: #fffefb; --line: #e0dbd1; --thin: #efeae1; --ink: #211e1a; --sub: #6f6a62; --faint: #8f887e;
    --acc: #f25b23; --acc-t: #c9420c; --wash: #fff0e8; --ans: #fff8f3; --ans-line: #f6dccd;
    --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --page: #111316; --card: #191c21; --line: rgba(255,255,255,.12); --thin: rgba(255,255,255,.07); --ink: #f2f1f3;
      --sub: #a3a7ae; --faint: #7b8088; --acc-t: #ff6b2a; --wash: rgba(242,91,35,.14); --ans: rgba(242,91,35,.07); --ans-line: rgba(242,91,35,.22); }
  }
  html[lang="ja"] { --ui: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif; }
  html[lang="zh"] { --ui: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  html[lang="zh-TW"] { --ui: "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
  html[lang="ko"] { --ui: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--page);
    color: var(--ink); font: 400 15px/1.5 var(--ui); -webkit-font-smoothing: antialiased; }
  main { width: 100%; max-width: 460px; padding: 26px 22px 20px; border-radius: 18px; background: var(--card);
    box-shadow: 0 0 0 1px var(--line), 0 12px 32px rgba(20,20,20,.08); }
  .ring { width: 36px; height: 36px; margin: 0 0 14px; border-radius: 50%; box-shadow: inset 0 0 0 4px var(--acc); }
  h1 { margin: 0 0 4px; font-size: 20px; line-height: 1.3; }
  p { margin: 0; color: var(--sub); }
  /* Причины — строками, как в меню Kukuluku: любая длина помещается. */
  .list { margin: 16px 0 14px; border-radius: 12px; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
  .row { display: flex; width: 100%; align-items: center; gap: 12px; min-height: 46px; padding: 8px 12px; border: 0; border-top: 1px solid var(--thin);
    background: transparent; color: var(--ink); font: 500 14px/1.35 var(--ui); text-align: start; cursor: pointer; transition: background 140ms ease; }
  .list .row:first-child { border-top: 0; }
  .row:hover { background: var(--wash); }
  .row:focus-visible { outline: 2px solid var(--acc); outline-offset: -2px; }
  .row svg { flex: none; width: 18px; height: 18px; color: var(--faint); }
  .row .chev { width: 14px; height: 14px; margin-inline-start: auto; color: var(--faint); }
  .row span { flex: 1; min-width: 0; }
  .row.picked { background: var(--wash); color: var(--acc-t); cursor: default; }
  .row.picked svg { color: var(--acc); }
  .row.picked .chev { display: none; }
  .row.dim { opacity: .42; cursor: default; }
  .row.dim:hover { background: transparent; }
  [dir="rtl"] .row .chev { transform: scaleX(-1); }
  /* Ответ прямо под выбранной причиной. */
  .ans { padding: 12px 14px 14px 42px; border-top: 1px solid var(--ans-line); background: var(--ans); color: var(--ink); font-size: 13.5px; line-height: 1.5; }
  [dir="rtl"] .ans { padding: 12px 42px 14px 14px; }
  .ans p { color: var(--ink); }
  .ans p + p { margin-top: 8px; }
  .ans ol { margin: 8px 0 0; padding-inline-start: 18px; display: grid; gap: 6px; }
  .ans .hint { margin-top: 10px; font-size: 12.5px; color: var(--sub); }
  .act { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
  [hidden] { display: none !important; }
  .cta { display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border: 0; border-radius: 9px; background: var(--acc); color: #fff;
    font: 600 13px/1 var(--ui); text-decoration: none; cursor: pointer; white-space: nowrap; }
  .cta:hover { filter: brightness(1.06); }
  .cta:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  select { height: 34px; min-width: 0; flex: 1 1 180px; padding: 0 10px; border-radius: 9px; border: 0; background: var(--card); color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--line); font: 400 13.5px/1 var(--ui); }
  .done { margin-top: 10px; color: var(--acc-t); font-weight: 500; }
  .note { font-size: 12px; color: var(--faint); }
  .again { display: inline-block; margin-top: 10px; color: var(--acc-t); font-size: 13px; font-weight: 500; text-decoration: none; }
  .again:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <div class="ring" aria-hidden="true"></div>
  <h1 id="title">Kukuluku has been removed</h1>
  <p id="ask">Why did you remove it? One click helps us know what to fix.</p>
  <div class="list" id="reasons" role="group" aria-labelledby="ask"></div>
  <p class="note" id="note"></p>
  <a class="again" id="again" href="https://chromewebstore.google.com/detail/kukuluku/hjjilfhmifjaaifbddfcfpcipeogclen"></a>
</main>

  // 21 язык меню и семь крупных языков без своего меню.
  var TEXT = {
    "ru": {"title":"Kukuluku удалён","ask":"Почему удалили? Одно нажатие — и мы поймём, что чинить.","reasons":["Перевод не появлялся","Нет моего языка","Перевод с ошибками","Уже не нужно"],"thanks":"Спасибо! Это правда помогает.","no_translation":{"lead":"Обычно дело в одном из трёх:","list":["Страница была служебной. В Интернет-магазин Chrome, настройки и новую вкладку Chrome не пускает никакие расширения. Откройте любой сайт и выделите текст там.","Текст уже на языке перевода: например, английский сайт и перевод на английский. Переводить нечего, поэтому окно не появляется. Выберите в меню свой язык.","Это были Google Документы, Таблицы или PDF. Там выделите текст и нажмите Ctrl+C."]},"inaccurate":["Переводит Google Переводчик — тот же, что встроен в Chrome.","С вашим ключом ИИ окно перевода объяснит смысл, тон и контекст трудной фразы."],"not_needed":["Спасибо, что пробовали. Возвращайтесь, когда снова понадобится перевод."],"langAsk":"Какой язык нужен?","langPick":"Выберите язык…","langOther":"Другой","langSend":"Отправить","langSent":"Спасибо! Добавим — очередь языков мы составляем по таким ответам.","langHint":"Переводить Kukuluku уже умеет на 250 языков: меню → «Все языки · 250» → поиск.","reinstall":"Установить снова","note":"Только версия и язык меню — без адресов страниц и личных данных.","again":"Передумали? Установить снова"},
    "uk": {"title":"Kukuluku видалено","ask":"Чому видалили? Одне натискання — і ми зрозуміємо, що лагодити.","reasons":["Переклад не з’являвся","Немає моєї мови","Переклад із помилками","Більше не потрібно"],"thanks":"Дякуємо! Це справді допомагає.","no_translation":{"lead":"Зазвичай річ в одному з трьох:","list":["Це була службова сторінка. До Інтернет-магазину Chrome, налаштувань і нової вкладки Chrome не пускає жодні розширення. Відкрийте будь-який сайт і виділіть текст там.","Текст уже мовою перекладу: наприклад, англійський сайт і переклад англійською. Перекладати нічого, тому вікно не з’являється. Виберіть у меню свою мову.","Це були Google Документи, Таблиці або PDF. Там виділіть текст і натисніть Ctrl+C."]},"inaccurate":["Перекладає Google Перекладач — той самий, що вбудований у Chrome.","З вашим ключем ШІ вікно перекладу пояснить зміст, тон і контекст складної фрази."],"not_needed":["Дякуємо, що спробували. Повертайтеся, коли знову знадобиться переклад."],"langAsk":"Яка мова потрібна?","langPick":"Виберіть мову…","langOther":"Інша","langSend":"Надіслати","langSent":"Дякуємо! Додамо — чергу мов ми складаємо за такими відповідями.","langHint":"Kukuluku вже перекладає 250 мовами: меню → «Усі мови · 250» → пошук.","reinstall":"Установити знову","note":"Лише версія та мова меню — без адрес сторінок і особистих даних.","again":"Передумали? Установити знову"},
    "en": {"title":"Kukuluku has been removed","ask":"Why did you remove it? One click helps us know what to fix.","reasons":["No translation appeared","My language is missing","The translation had errors","Don’t need it anymore"],"thanks":"Thank you! This really helps.","no_translation":{"lead":"Usually it is one of three things:","list":["It was a Chrome page. Chrome keeps all extensions out of the Chrome Web Store, settings and the new tab page. Open any website and select text there.","The text is already in your translation language: say, an English site and translation into English. There is nothing to translate, so no window appears. Pick your own language in the menu.","It was Google Docs, Sheets or a PDF. There, select the text and press Ctrl+C."]},"inaccurate":["Translation comes from Google Translate — the same one built into Chrome.","With your own AI key, the translation window explains the meaning, tone and context of tricky phrases."],"not_needed":["Thanks for trying it. Come back whenever you need a translation again."],"langAsk":"Which language do you need?","langPick":"Choose a language…","langOther":"Other","langSend":"Send","langSent":"Thank you! We’ll add it — we line up new languages by answers like this.","langHint":"Kukuluku already translates into 250 languages: menu → “All 250 languages” → search.","reinstall":"Install again","note":"Only the version and the menu language — no page addresses, no personal data.","again":"Changed your mind? Install again"},
    "de": {"title":"Kukuluku wurde entfernt","ask":"Warum haben Sie es entfernt? Ein Klick zeigt uns, was wir verbessern müssen.","reasons":["Es erschien keine Übersetzung","Meine Sprache fehlt","Die Übersetzung war fehlerhaft","Brauche ich nicht mehr"],"thanks":"Danke! Das hilft uns wirklich.","no_translation":{"lead":"Meist liegt es an einem von drei Dingen:","list":["Es war eine Chrome-Seite. Im Chrome Web Store, in den Einstellungen und auf der Seite „Neuer Tab“ lässt Chrome keine Erweiterungen zu. Öffnen Sie eine beliebige Website und markieren Sie dort Text.","Der Text ist schon in Ihrer Zielsprache, zum Beispiel eine englische Website und Übersetzung ins Englische. Dann gibt es nichts zu übersetzen und kein Fenster erscheint. Wählen Sie im Menü Ihre Sprache.","Es war Google Docs, Tabellen oder ein PDF. Markieren Sie dort den Text und drücken Sie Strg+C."]},"inaccurate":["Die Übersetzung stammt von Google Übersetzer, demselben Dienst, der in Chrome eingebaut ist.","Mit Ihrem eigenen KI-Schlüssel erklärt das Übersetzungsfenster Bedeutung, Ton und Kontext schwieriger Sätze."],"not_needed":["Danke fürs Ausprobieren. Kommen Sie wieder, wenn Sie eine Übersetzung brauchen."],"langAsk":"Welche Sprache brauchen Sie?","langPick":"Sprache wählen…","langOther":"Andere","langSend":"Senden","langSent":"Danke! Wir nehmen sie auf: Die Reihenfolge neuer Sprachen richtet sich nach solchen Antworten.","langHint":"Kukuluku übersetzt bereits in 250 Sprachen: Menü → „Alle 250 Sprachen“ → Suche.","reinstall":"Neu installieren","note":"Nur die Version und die Menüsprache, keine Seitenadressen und keine persönlichen Daten.","again":"Doch anders entschieden? Neu installieren"},
    "fr": {"title":"Kukuluku a été supprimé","ask":"Pourquoi l’avez-vous supprimé ? Un clic nous aide à savoir quoi corriger.","reasons":["Aucune traduction n’apparaissait","Ma langue n’est pas disponible","La traduction contenait des erreurs","Je n’en ai plus besoin"],"thanks":"Merci ! Cela nous aide vraiment.","no_translation":{"lead":"En général, c’est l’une de ces trois raisons :","list":["C’était une page Chrome. Chrome interdit toute extension sur le Chrome Web Store, dans les paramètres et sur la page Nouvel onglet. Ouvrez n’importe quel site et sélectionnez-y du texte.","Le texte était déjà dans votre langue de traduction : par exemple, un site en anglais et une traduction vers l’anglais. Il n’y a rien à traduire, donc aucune fenêtre n’apparaît. Choisissez votre langue dans le menu.","C’était Google Docs, Sheets ou un PDF. Sélectionnez-y le texte et appuyez sur Ctrl+C."]},"inaccurate":["La traduction vient de Google Traduction, le même service que celui intégré à Chrome.","Avec votre propre clé d’IA, la fenêtre de traduction explique le sens, le ton et le contexte des phrases difficiles."],"not_needed":["Merci de l’avoir essayé. Revenez quand vous aurez de nouveau besoin d’une traduction."],"langAsk":"De quelle langue avez-vous besoin ?","langPick":"Choisir une langue…","langOther":"Autre","langSend":"Envoyer","langSent":"Merci ! Nous l’ajouterons : ces réponses décident de l’ordre des nouvelles langues.","langHint":"Kukuluku traduit déjà vers 250 langues : menu → « Les 250 langues » → recherche.","reinstall":"Réinstaller","note":"Uniquement la version et la langue du menu, sans adresses de pages ni données personnelles.","again":"Vous avez changé d’avis ? Réinstaller"},
    "es": {"title":"Kukuluku se ha eliminado","ask":"¿Por qué lo eliminaste? Un clic nos ayuda a saber qué arreglar.","reasons":["No aparecía la traducción","Falta mi idioma","La traducción tenía errores","Ya no lo necesito"],"thanks":"¡Gracias! Esto ayuda de verdad.","no_translation":{"lead":"Normalmente es una de estas tres cosas:","list":["Era una página de Chrome. Chrome no permite extensiones en Chrome Web Store, en la configuración ni en la página de nueva pestaña. Abre cualquier sitio web y selecciona texto allí.","El texto ya estaba en tu idioma de traducción: por ejemplo, un sitio en inglés y traducción al inglés. No hay nada que traducir, así que no aparece la ventana. Elige tu idioma en el menú.","Era Google Docs, Hojas de cálculo o un PDF. Allí selecciona el texto y pulsa Ctrl+C."]},"inaccurate":["La traducción viene de Google Translate, el mismo que está integrado en Chrome.","Con tu propia clave de IA, la ventana de traducción explica el sentido, el tono y el contexto de las frases difíciles."],"not_needed":["Gracias por probarlo. Vuelve cuando necesites una traducción."],"langAsk":"¿Qué idioma necesitas?","langPick":"Elige un idioma…","langOther":"Otro","langSend":"Enviar","langSent":"¡Gracias! Lo añadiremos: estas respuestas deciden el orden de los nuevos idiomas.","langHint":"Kukuluku ya traduce a 250 idiomas: menú → «Los 250 idiomas» → búsqueda.","reinstall":"Instalar de nuevo","note":"Solo la versión y el idioma del menú, sin direcciones de páginas ni datos personales.","again":"¿Cambiaste de opinión? Instalar de nuevo"},
    "pt": {"title":"O Kukuluku foi removido","ask":"Por que você removeu? Um clique nos ajuda a saber o que corrigir.","reasons":["A tradução não apareceu","Meu idioma não está disponível","A tradução tinha erros","Não preciso mais"],"thanks":"Obrigado! Isso ajuda de verdade.","no_translation":{"lead":"Normalmente é uma destas três coisas:","list":["Era uma página do Chrome. O Chrome não permite extensões na Chrome Web Store, nas configurações nem na página de nova guia. Abra qualquer site e selecione o texto lá.","O texto já estava no seu idioma de tradução: por exemplo, um site em inglês e tradução para o inglês. Não há o que traduzir, por isso a janela não aparece. Escolha o seu idioma no menu.","Era o Google Docs, o Planilhas ou um PDF. Nesses casos, selecione o texto e pressione Ctrl+C."]},"inaccurate":["A tradução vem do Google Tradutor, o mesmo que está integrado ao Chrome.","Com sua própria chave de IA, a janela de tradução explica o sentido, o tom e o contexto de frases difíceis."],"not_needed":["Obrigado por experimentar. Volte quando precisar de uma tradução."],"langAsk":"De qual idioma você precisa?","langPick":"Escolha um idioma…","langOther":"Outro","langSend":"Enviar","langSent":"Obrigado! Vamos adicioná-lo: essas respostas definem a ordem dos novos idiomas.","langHint":"O Kukuluku já traduz para 250 idiomas: menu → “Todos os 250 idiomas” → pesquisa.","reinstall":"Instalar novamente","note":"Apenas a versão e o idioma do menu, sem endereços de páginas nem dados pessoais.","again":"Mudou de ideia? Instalar novamente"},
    "pl": {"title":"Kukuluku został usunięty","ask":"Dlaczego go usunięto? Jedno kliknięcie pokaże nam, co naprawić.","reasons":["Tłumaczenie się nie pojawiało","Brakuje mojego języka","Tłumaczenie miało błędy","Już nie jest potrzebny"],"thanks":"Dziękujemy! To naprawdę pomaga.","no_translation":{"lead":"Zwykle chodzi o jedną z trzech rzeczy:","list":["To była strona Chrome. W Chrome Web Store, ustawieniach i na stronie nowej karty Chrome nie dopuszcza żadnych rozszerzeń. Otwórz dowolną stronę i zaznacz tekst tam.","Tekst był już w języku tłumaczenia, na przykład angielska strona i tłumaczenie na angielski. Nie ma czego tłumaczyć, więc okno się nie pojawia. Wybierz w menu swój język.","To były Dokumenty Google, Arkusze lub PDF. Tam zaznacz tekst i naciśnij Ctrl+C."]},"inaccurate":["Tłumaczenie pochodzi z Tłumacza Google, tego samego, który jest wbudowany w Chrome.","Z własnym kluczem AI okno tłumaczenia wyjaśni znaczenie, ton i kontekst trudnych zdań."],"not_needed":["Dziękujemy za wypróbowanie. Wróć, gdy znów będziesz potrzebować tłumaczenia."],"langAsk":"Jakiego języka potrzebujesz?","langPick":"Wybierz język…","langOther":"Inny","langSend":"Wyślij","langSent":"Dziękujemy! Dodamy go: kolejność nowych języków ustalamy na podstawie takich odpowiedzi.","langHint":"Kukuluku tłumaczy już na 250 języków: menu → „Wszystkie języki · 250” → wyszukiwanie.","reinstall":"Zainstaluj ponownie","note":"Tylko wersja i język menu, bez adresów stron i danych osobowych.","again":"Zmiana decyzji? Zainstaluj ponownie"},
    "it": {"title":"Kukuluku è stato rimosso","ask":"Perché l’hai rimosso? Un clic ci aiuta a capire cosa correggere.","reasons":["La traduzione non appariva","Manca la mia lingua","La traduzione aveva errori","Non mi serve più"],"thanks":"Grazie! È davvero utile.","no_translation":{"lead":"Di solito è una di queste tre cose:","list":["Era una pagina di Chrome. Chrome non consente estensioni nel Chrome Web Store, nelle impostazioni e nella pagina Nuova scheda. Apri un qualsiasi sito e seleziona lì il testo.","Il testo era già nella tua lingua di traduzione: per esempio un sito in inglese e la traduzione in inglese. Non c’è nulla da tradurre, quindi la finestra non appare. Scegli la tua lingua nel menu.","Era Google Documenti, Fogli o un PDF. Lì seleziona il testo e premi Ctrl+C."]},"inaccurate":["La traduzione arriva da Google Traduttore, lo stesso integrato in Chrome.","Con la tua chiave IA, la finestra di traduzione spiega significato, tono e contesto delle frasi difficili."],"not_needed":["Grazie per averlo provato. Torna quando ti servirà una traduzione."],"langAsk":"Di quale lingua hai bisogno?","langPick":"Scegli una lingua…","langOther":"Altra","langSend":"Invia","langSent":"Grazie! La aggiungeremo: l’ordine delle nuove lingue dipende da risposte come questa.","langHint":"Kukuluku traduce già in 250 lingue: menu → «All 250 languages» → ricerca.","reinstall":"Installa di nuovo","note":"Solo la versione e la lingua del menu, senza indirizzi di pagine né dati personali.","again":"Hai cambiato idea? Installa di nuovo"},
    "nl": {"title":"Kukuluku is verwijderd","ask":"Waarom heb je het verwijderd? Eén klik laat ons zien wat we moeten verbeteren.","reasons":["Er verscheen geen vertaling","Mijn taal ontbreekt","De vertaling bevatte fouten","Ik heb het niet meer nodig"],"thanks":"Bedankt! Dit helpt echt.","no_translation":{"lead":"Meestal is het een van deze drie dingen:","list":["Het was een Chrome-pagina. Chrome laat geen extensies toe in de Chrome Web Store, de instellingen en op de pagina Nieuw tabblad. Open een willekeurige website en selecteer daar tekst.","De tekst stond al in je vertaaltaal: bijvoorbeeld een Engelse site en vertaling naar het Engels. Er valt niets te vertalen, dus er verschijnt geen venster. Kies je eigen taal in het menu.","Het was Google Documenten, Spreadsheets of een pdf. Selecteer daar de tekst en druk op Ctrl+C."]},"inaccurate":["De vertaling komt van Google Translate, dezelfde die in Chrome is ingebouwd.","Met je eigen AI-sleutel legt het vertaalvenster de betekenis, toon en context van lastige zinnen uit."],"not_needed":["Bedankt voor het proberen. Kom terug wanneer je weer een vertaling nodig hebt."],"langAsk":"Welke taal heb je nodig?","langPick":"Kies een taal…","langOther":"Andere","langSend":"Versturen","langSent":"Bedankt! We voegen hem toe: zulke antwoorden bepalen de volgorde van nieuwe talen.","langHint":"Kukuluku vertaalt al naar 250 talen: menu → “All 250 languages” → zoeken.","reinstall":"Opnieuw installeren","note":"Alleen de versie en de menutaal, geen paginaadressen of persoonsgegevens.","again":"Toch van gedachten veranderd? Opnieuw installeren"},
    "ro": {"title":"Kukuluku a fost eliminat","ask":"De ce l-ați eliminat? Un clic ne ajută să știm ce să reparăm.","reasons":["Traducerea nu a apărut","Limba mea lipsește","Traducerea avea erori","Nu îmi mai trebuie"],"thanks":"Mulțumim! Chiar ne ajută.","no_translation":{"lead":"De obicei este vorba de unul dintre aceste trei lucruri:","list":["Era o pagină Chrome. Chrome nu permite extensii în Magazinul web Chrome, în setări și pe pagina de filă nouă. Deschideți orice site și selectați textul acolo.","Textul era deja în limba de traducere: de exemplu, un site în engleză și traducere în engleză. Nu este nimic de tradus, așa că fereastra nu apare. Alegeți limba dvs. din meniu.","Era Google Docs, Sheets sau un PDF. Acolo selectați textul și apăsați Ctrl+C."]},"inaccurate":["Traducerea vine de la Google Traducere, același serviciu integrat în Chrome.","Cu propria cheie AI, fereastra de traducere explică sensul, tonul și contextul frazelor dificile."],"not_needed":["Mulțumim că l-ați încercat. Reveniți când aveți din nou nevoie de o traducere."],"langAsk":"De ce limbă aveți nevoie?","langPick":"Alegeți o limbă…","langOther":"Alta","langSend":"Trimiteți","langSent":"Mulțumim! O vom adăuga: ordinea noilor limbi depinde de astfel de răspunsuri.","langHint":"Kukuluku traduce deja în 250 de limbi: meniu → „All 250 languages” → căutare.","reinstall":"Instalați din nou","note":"Doar versiunea și limba meniului, fără adrese de pagini și date personale.","again":"V-ați răzgândit? Instalați din nou"},
    "hu": {"title":"A Kukuluku eltávolítva","ask":"Miért távolította el? Egy kattintás, és tudjuk, mit kell javítani.","reasons":["Nem jelent meg a fordítás","Hiányzik a nyelvem","Hibás volt a fordítás","Már nincs rá szükségem"],"thanks":"Köszönjük! Ez tényleg segít.","no_translation":{"lead":"Általában a következő három dolog egyike okozza:","list":["Chrome-oldal volt. A Chrome Internetes áruházban, a beállításokban és az új lap oldalán a Chrome nem enged működni bővítményeket. Nyisson meg bármilyen webhelyet, és ott jelöljön ki szöveget.","A szöveg már a fordítás nyelvén volt: például angol webhely és angolra fordítás. Nincs mit lefordítani, ezért az ablak nem jelenik meg. Válassza ki a saját nyelvét a menüben.","Google Dokumentumok, Táblázatok vagy PDF volt. Ott jelölje ki a szöveget, és nyomja meg a Ctrl+C billentyűket."]},"inaccurate":["A fordítás a Google Fordítótól származik, amely a Chrome-ba is be van építve.","Saját AI-kulccsal a fordítóablak megmagyarázza a nehéz mondatok jelentését, hangnemét és szövegkörnyezetét."],"not_needed":["Köszönjük, hogy kipróbálta. Térjen vissza, ha ismét fordításra van szüksége."],"langAsk":"Milyen nyelvre van szüksége?","langPick":"Válasszon nyelvet…","langOther":"Másik","langSend":"Küldés","langSent":"Köszönjük! Hozzáadjuk: az új nyelvek sorrendjét az ilyen válaszok döntik el.","langHint":"A Kukuluku már 250 nyelvre fordít: menü → „All 250 languages” → keresés.","reinstall":"Újratelepítés","note":"Csak a verzió és a menü nyelve, oldalcímek és személyes adatok nélkül.","again":"Meggondolta magát? Újratelepítés"},
    "tr": {"title":"Kukuluku kaldırıldı","ask":"Neden kaldırdınız? Tek bir tıklama neyi düzelteceğimizi gösterir.","reasons":["Çeviri görünmedi","Dilim yok","Çeviride hatalar vardı","Artık ihtiyacım yok"],"thanks":"Teşekkürler! Bu gerçekten işimize yarıyor.","no_translation":{"lead":"Genellikle şu üç şeyden biridir:","list":["Bir Chrome sayfasıydı. Chrome; Chrome Web Mağazası, ayarlar ve yeni sekme sayfasında hiçbir uzantıya izin vermez. Herhangi bir site açın ve metni orada seçin.","Metin zaten çeviri dilinizdeydi: örneğin İngilizce bir site ve İngilizceye çeviri. Çevrilecek bir şey olmadığı için pencere görünmez. Menüden kendi dilinizi seçin.","Google Dokümanlar, E-Tablolar veya PDF’ti. Orada metni seçip Ctrl+C tuşlarına basın."]},"inaccurate":["Çeviri, Chrome’da yerleşik olan Google Çeviri’den gelir.","Kendi yapay zekâ anahtarınızla çeviri penceresi zor ifadelerin anlamını, tonunu ve bağlamını açıklar."],"not_needed":["Denediğiniz için teşekkürler. Yine çeviriye ihtiyaç duyduğunuzda geri gelin."],"langAsk":"Hangi dile ihtiyacınız var?","langPick":"Dil seçin…","langOther":"Diğer","langSend":"Gönder","langSent":"Teşekkürler! Ekleyeceğiz: yeni dillerin sırasını bu yanıtlar belirliyor.","langHint":"Kukuluku zaten 250 dile çeviriyor: menü → “Tüm diller · 250” → arama.","reinstall":"Yeniden yükle","note":"Yalnızca sürüm ve menü dili; sayfa adresleri ve kişisel veriler yok.","again":"Fikrinizi mi değiştirdiniz? Yeniden yükleyin"},
    "vi": {"title":"Đã gỡ Kukuluku","ask":"Vì sao bạn gỡ? Chỉ một cú nhấp giúp chúng tôi biết cần sửa gì.","reasons":["Bản dịch không hiện ra","Không có ngôn ngữ của tôi","Bản dịch có lỗi","Không cần nữa"],"thanks":"Cảm ơn bạn! Điều này thực sự có ích.","no_translation":{"lead":"Thường là một trong ba lý do sau:","list":["Đó là trang của Chrome. Chrome không cho tiện ích nào chạy trong Cửa hàng Chrome trực tuyến, trang cài đặt và trang thẻ mới. Hãy mở một trang web bất kỳ và chọn văn bản ở đó.","Văn bản đã ở sẵn ngôn ngữ dịch của bạn: ví dụ trang tiếng Anh và dịch sang tiếng Anh. Không có gì để dịch nên cửa sổ không hiện ra. Hãy chọn ngôn ngữ của bạn trong menu.","Đó là Google Tài liệu, Trang tính hoặc PDF. Ở đó, hãy chọn văn bản rồi nhấn Ctrl+C."]},"inaccurate":["Bản dịch đến từ Google Dịch, chính là dịch vụ tích hợp trong Chrome.","Với khóa AI của riêng bạn, cửa sổ dịch sẽ giải thích ý nghĩa, giọng điệu và ngữ cảnh của những câu khó."],"not_needed":["Cảm ơn bạn đã dùng thử. Hãy quay lại khi bạn cần dịch."],"langAsk":"Bạn cần ngôn ngữ nào?","langPick":"Chọn ngôn ngữ…","langOther":"Khác","langSend":"Gửi","langSent":"Cảm ơn bạn! Chúng tôi sẽ thêm: thứ tự ngôn ngữ mới dựa trên những câu trả lời như thế này.","langHint":"Kukuluku đã dịch sang 250 ngôn ngữ: menu → “Tất cả 250 ngôn ngữ” → tìm kiếm.","reinstall":"Cài đặt lại","note":"Chỉ phiên bản và ngôn ngữ menu, không có địa chỉ trang hay dữ liệu cá nhân.","again":"Đổi ý? Cài đặt lại"},
    "id": {"title":"Kukuluku telah dihapus","ask":"Mengapa Anda menghapusnya? Satu klik membantu kami tahu apa yang perlu diperbaiki.","reasons":["Terjemahan tidak muncul","Bahasa saya tidak ada","Terjemahannya salah","Tidak diperlukan lagi"],"thanks":"Terima kasih! Ini sangat membantu.","no_translation":{"lead":"Biasanya karena salah satu dari tiga hal ini:","list":["Itu halaman Chrome. Chrome tidak mengizinkan ekstensi di Chrome Web Store, setelan, dan halaman tab baru. Buka situs apa pun dan pilih teks di sana.","Teks sudah dalam bahasa terjemahan Anda: misalnya situs berbahasa Inggris dan terjemahan ke bahasa Inggris. Tidak ada yang perlu diterjemahkan, jadi jendela tidak muncul. Pilih bahasa Anda di menu.","Itu Google Dokumen, Spreadsheet, atau PDF. Di sana, pilih teks lalu tekan Ctrl+C."]},"inaccurate":["Terjemahan berasal dari Google Terjemahan, yang sama dengan yang ada di Chrome.","Dengan kunci AI Anda sendiri, jendela terjemahan menjelaskan makna, nada, dan konteks kalimat yang sulit."],"not_needed":["Terima kasih sudah mencoba. Kembalilah saat Anda memerlukan terjemahan."],"langAsk":"Bahasa apa yang Anda perlukan?","langPick":"Pilih bahasa…","langOther":"Lainnya","langSend":"Kirim","langSent":"Terima kasih! Kami akan menambahkannya: urutan bahasa baru kami susun dari jawaban seperti ini.","langHint":"Kukuluku sudah menerjemahkan ke 250 bahasa: menu → “Semua 250 bahasa” → pencarian.","reinstall":"Pasang lagi","note":"Hanya versi dan bahasa menu, tanpa alamat halaman atau data pribadi.","again":"Berubah pikiran? Pasang lagi"},
    "ms": {"title":"Kukuluku telah dialih keluar","ask":"Mengapa anda mengalih keluarnya? Satu klik membantu kami tahu apa yang perlu dibaiki.","reasons":["Terjemahan tidak muncul","Bahasa saya tiada","Terjemahan ada kesilapan","Tidak diperlukan lagi"],"thanks":"Terima kasih! Ini sangat membantu.","no_translation":{"lead":"Biasanya ia salah satu daripada tiga perkara ini:","list":["Itu halaman Chrome. Chrome tidak membenarkan sambungan di Chrome Web Store, tetapan dan halaman tab baharu. Buka mana-mana laman web dan pilih teks di sana.","Teks sudah dalam bahasa terjemahan anda: contohnya laman bahasa Inggeris dan terjemahan ke bahasa Inggeris. Tiada apa untuk diterjemahkan, jadi tetingkap tidak muncul. Pilih bahasa anda dalam menu.","Itu Google Dokumen, Helaian atau PDF. Di sana, pilih teks dan tekan Ctrl+C."]},"inaccurate":["Terjemahan datang daripada Google Terjemah, yang sama seperti terbina dalam Chrome.","Dengan kunci AI anda sendiri, tetingkap terjemahan menerangkan maksud, nada dan konteks ayat yang sukar."],"not_needed":["Terima kasih kerana mencuba. Kembalilah apabila anda memerlukan terjemahan."],"langAsk":"Bahasa apa yang anda perlukan?","langPick":"Pilih bahasa…","langOther":"Lain-lain","langSend":"Hantar","langSent":"Terima kasih! Kami akan menambahkannya: susunan bahasa baharu ditentukan oleh jawapan seperti ini.","langHint":"Kukuluku sudah menterjemah ke 250 bahasa: menu → “All 250 languages” → carian.","reinstall":"Pasang semula","note":"Hanya versi dan bahasa menu, tanpa alamat halaman atau data peribadi.","again":"Ubah fikiran? Pasang semula"},
    "tl": {"title":"Naalis na ang Kukuluku","ask":"Bakit mo ito inalis? Isang click lang para malaman namin kung ano ang aayusin.","reasons":["Hindi lumabas ang pagsasalin","Wala ang wika ko","May mali sa pagsasalin","Hindi ko na kailangan"],"thanks":"Salamat! Malaking tulong ito.","no_translation":{"lead":"Kadalasan, isa ito sa tatlong bagay na ito:","list":["Pahina ito ng Chrome. Hindi pinapayagan ng Chrome ang mga extension sa Chrome Web Store, settings, at bagong tab. Magbukas ng kahit anong website at doon pumili ng teksto.","Nasa wika ng pagsasalin mo na ang teksto: halimbawa, site na Ingles at pagsasalin sa Ingles. Walang isasalin kaya hindi lumalabas ang window. Piliin ang sarili mong wika sa menu.","Google Docs, Sheets, o PDF ito. Doon, piliin ang teksto at pindutin ang Ctrl+C."]},"inaccurate":["Galing ang pagsasalin sa Google Translate, ang kaparehong nasa Chrome.","Gamit ang sarili mong AI key, ipapaliwanag ng window ng pagsasalin ang kahulugan, tono, at konteksto ng mahihirap na parirala."],"not_needed":["Salamat sa pagsubok. Bumalik ka kapag kailangan mo ulit ng pagsasalin."],"langAsk":"Anong wika ang kailangan mo?","langPick":"Pumili ng wika…","langOther":"Iba pa","langSend":"Ipadala","langSent":"Salamat! Idadagdag namin ito: ang mga ganitong sagot ang batayan ng pagkakasunod-sunod ng mga bagong wika.","langHint":"Nakakapagsalin na ang Kukuluku sa 250 wika: menu → “All 250 languages” → hanapin.","reinstall":"I-install muli","note":"Bersyon at wika ng menu lang, walang address ng pahina o personal na data.","again":"Nagbago ang isip? I-install muli"},
    "ja": {"title":"Kukuluku を削除しました","ask":"削除した理由を教えてください。ワンクリックで、直すべき点がわかります。","reasons":["翻訳が表示されなかった","自分の言語がない","翻訳に誤りがあった","もう必要ない"],"thanks":"ありがとうございます。とても助かります。","no_translation":{"lead":"原因はたいてい次の3つのどれかです。","list":["Chrome の専用ページでした。Chrome ウェブストア、設定、新しいタブでは、Chrome がすべての拡張機能を止めています。普通のサイトを開いて、そこでテキストを選択してください。","テキストがすでに翻訳先の言語でした。たとえば英語のサイトを英語に翻訳する場合です。翻訳するものがないので、ウィンドウは出ません。メニューで自分の言語を選んでください。","Google ドキュメント、スプレッドシート、PDF でした。これらではテキストを選択して Ctrl+C を押してください。"]},"inaccurate":["翻訳には、Chrome に組み込まれているものと同じ Google 翻訳を使っています。","ご自身の AI キーがあれば、翻訳ウィンドウが難しい表現の意味、トーン、文脈を説明します。"],"not_needed":["お試しいただきありがとうございました。また翻訳が必要なときにお戻りください。"],"langAsk":"どの言語が必要ですか？","langPick":"言語を選択…","langOther":"その他","langSend":"送信","langSent":"ありがとうございます。追加します。新しい言語の順番は、こうした回答で決めています。","langHint":"Kukuluku はすでに 250 言語に翻訳できます：メニュー → 「全250言語」 → 検索。","reinstall":"もう一度インストール","note":"送信するのはバージョンとメニュー言語だけで、ページのアドレスや個人情報は含みません。","again":"気が変わりましたか？もう一度インストール"},
    "ko": {"title":"Kukuluku가 삭제되었습니다","ask":"왜 삭제하셨나요? 한 번만 눌러 주시면 무엇을 고칠지 알 수 있습니다.","reasons":["번역이 나타나지 않음","내 언어가 없음","번역에 오류가 있음","더 이상 필요 없음"],"thanks":"감사합니다! 정말 도움이 됩니다.","no_translation":{"lead":"보통 다음 세 가지 중 하나입니다.","list":["Chrome 전용 페이지였습니다. Chrome은 Chrome 웹 스토어, 설정, 새 탭 페이지에서 모든 확장 프로그램을 막습니다. 아무 웹사이트나 열고 거기서 텍스트를 선택하세요.","텍스트가 이미 번역 언어였습니다. 예를 들어 영어 사이트를 영어로 번역하는 경우입니다. 번역할 내용이 없어 창이 나타나지 않습니다. 메뉴에서 내 언어를 선택하세요.","Google 문서, 스프레드시트 또는 PDF였습니다. 여기서는 텍스트를 선택하고 Ctrl+C를 누르세요."]},"inaccurate":["번역은 Chrome에 내장된 것과 같은 Google 번역을 사용합니다.","내 AI 키가 있으면 번역 창이 어려운 표현의 의미, 어조, 맥락을 설명해 줍니다."],"not_needed":["사용해 주셔서 감사합니다. 번역이 필요할 때 다시 찾아 주세요."],"langAsk":"어떤 언어가 필요하신가요?","langPick":"언어 선택…","langOther":"기타","langSend":"보내기","langSent":"감사합니다! 추가하겠습니다. 새 언어의 순서는 이런 답변으로 정합니다.","langHint":"Kukuluku는 이미 250개 언어로 번역합니다: 메뉴 → “전체 250개 언어” → 검색.","reinstall":"다시 설치","note":"버전과 메뉴 언어만 전송하며 페이지 주소나 개인 정보는 포함하지 않습니다.","again":"마음이 바뀌셨나요? 다시 설치"},
    "zh": {"title":"Kukuluku 已移除","ask":"您为什么移除它？点一下，我们就知道该修什么。","reasons":["没有出现翻译","没有我的语言","翻译有错误","不再需要"],"thanks":"谢谢！这真的很有帮助。","no_translation":{"lead":"通常是以下三种情况之一：","list":["这是 Chrome 专用页面。Chrome 不允许任何扩展程序在 Chrome 应用商店、设置和新标签页中运行。请打开任意网站，在那里选择文字。","文字已经是您的翻译语言：例如英文网站翻译成英文。没有需要翻译的内容，所以不会出现窗口。请在菜单中选择您的语言。","这是 Google 文档、表格或 PDF。在这些地方，请选择文字并按 Ctrl+C。"]},"inaccurate":["翻译来自 Google 翻译，与 Chrome 内置的相同。","使用您自己的 AI 密钥，翻译窗口可以解释难句的含义、语气和语境。"],"not_needed":["感谢您的试用。需要翻译时欢迎回来。"],"langAsk":"您需要哪种语言？","langPick":"选择语言…","langOther":"其他","langSend":"发送","langSent":"谢谢！我们会添加：新语言的先后顺序就由这样的回答决定。","langHint":"Kukuluku 已能翻译成 250 种语言：菜单 → “全部 250 种语言” → 搜索。","reinstall":"重新安装","note":"仅包含版本和菜单语言，不含网页地址和个人数据。","again":"改变主意了？重新安装"},
    "zh-tw": {"title":"Kukuluku 已移除","ask":"您為什麼移除它？點一下，我們就知道該修什麼。","reasons":["沒有出現翻譯","沒有我的語言","翻譯有錯誤","不再需要"],"thanks":"謝謝！這真的很有幫助。","no_translation":{"lead":"通常是以下三種情況之一：","list":["這是 Chrome 專用頁面。Chrome 不允許任何擴充功能在 Chrome 線上應用程式商店、設定和新分頁中執行。請開啟任何網站，在那裡選取文字。","文字已經是您的翻譯語言：例如英文網站翻譯成英文。沒有需要翻譯的內容，所以不會出現視窗。請在選單中選擇您的語言。","這是 Google 文件、試算表或 PDF。在這些地方，請選取文字並按 Ctrl+C。"]},"inaccurate":["翻譯來自 Google 翻譯，與 Chrome 內建的相同。","使用您自己的 AI 金鑰，翻譯視窗可以解釋難句的含義、語氣和語境。"],"not_needed":["感謝您的試用。需要翻譯時歡迎回來。"],"langAsk":"您需要哪種語言？","langPick":"選擇語言…","langOther":"其他","langSend":"傳送","langSent":"謝謝！我們會加入：新語言的先後順序就由這樣的回答決定。","langHint":"Kukuluku 已能翻譯成 250 種語言：選單 → 「全部 250 種語言」 → 搜尋。","reinstall":"重新安裝","note":"僅包含版本和選單語言，不含網頁位址和個人資料。","again":"改變主意了？重新安裝"},
    "th": {"title":"ลบ Kukuluku แล้ว","ask":"ทำไมคุณจึงลบ? คลิกเดียวช่วยให้เรารู้ว่าควรแก้อะไร","reasons":["คำแปลไม่ปรากฏ","ไม่มีภาษาของฉัน","คำแปลมีข้อผิดพลาด","ไม่ต้องการแล้ว"],"thanks":"ขอบคุณ! สิ่งนี้ช่วยเราได้มาก","no_translation":{"lead":"โดยปกติมักเป็นหนึ่งในสามเรื่องนี้:","list":["นั่นคือหน้าของ Chrome ซึ่ง Chrome ไม่อนุญาตให้ส่วนขยายทำงานใน Chrome เว็บสโตร์ การตั้งค่า และหน้าแท็บใหม่ โปรดเปิดเว็บไซต์ใดก็ได้แล้วเลือกข้อความที่นั่น","ข้อความเป็นภาษาที่คุณแปลอยู่แล้ว เช่น เว็บไซต์ภาษาอังกฤษและแปลเป็นภาษาอังกฤษ จึงไม่มีอะไรให้แปลและหน้าต่างไม่ปรากฏ โปรดเลือกภาษาของคุณในเมนู","นั่นคือ Google เอกสาร ชีต หรือ PDF ในกรณีนี้ให้เลือกข้อความแล้วกด Ctrl+C"]},"inaccurate":["คำแปลมาจาก Google แปลภาษา ตัวเดียวกับที่มีใน Chrome","เมื่อใช้คีย์ AI ของคุณเอง หน้าต่างแปลจะอธิบายความหมาย น้ำเสียง และบริบทของประโยคที่ยากได้"],"not_needed":["ขอบคุณที่ลองใช้ กลับมาได้เสมอเมื่อต้องการคำแปล"],"langAsk":"คุณต้องการภาษาอะไร?","langPick":"เลือกภาษา…","langOther":"อื่นๆ","langSend":"ส่ง","langSent":"ขอบคุณ! เราจะเพิ่มให้ ลำดับภาษาใหม่มาจากคำตอบแบบนี้","langHint":"Kukuluku แปลได้แล้ว 250 ภาษา: เมนู → “ทุกภาษา · 250” → ค้นหา","reinstall":"ติดตั้งอีกครั้ง","note":"มีเพียงเวอร์ชันและภาษาเมนู ไม่มีที่อยู่หน้าเว็บหรือข้อมูลส่วนตัว","again":"เปลี่ยนใจแล้วหรือ? ติดตั้งอีกครั้ง"},
    "hi": {"title":"Kukuluku हटा दिया गया","ask":"आपने इसे क्यों हटाया? एक क्लिक से हमें पता चलेगा कि क्या ठीक करना है।","reasons":["अनुवाद नहीं दिखा","मेरी भाषा नहीं है","अनुवाद में गलतियाँ थीं","अब ज़रूरत नहीं"],"thanks":"धन्यवाद! इससे सच में मदद मिलती है।","no_translation":{"lead":"आमतौर पर इन तीन में से कोई एक वजह होती है:","list":["यह Chrome का अपना पेज था। Chrome वेब स्टोर, सेटिंग्स और नए टैब पेज पर Chrome किसी भी एक्सटेंशन को नहीं चलने देता। कोई भी वेबसाइट खोलें और वहाँ टेक्स्ट चुनें।","टेक्स्ट पहले से आपकी अनुवाद की भाषा में था: जैसे अंग्रेज़ी साइट और अंग्रेज़ी में अनुवाद। अनुवाद करने को कुछ नहीं था, इसलिए विंडो नहीं दिखी। मेनू में अपनी भाषा चुनें।","यह Google Docs, Sheets या PDF था। वहाँ टेक्स्ट चुनें और Ctrl+C दबाएँ।"]},"inaccurate":["अनुवाद Google Translate से आता है, वही जो Chrome में शामिल है।","अपनी AI कुंजी से अनुवाद विंडो कठिन वाक्यों का अर्थ, लहजा और संदर्भ समझाती है।"],"not_needed":["आज़माने के लिए धन्यवाद। जब फिर अनुवाद की ज़रूरत हो, तो वापस आएँ।"],"langAsk":"आपको कौन सी भाषा चाहिए?","langPick":"भाषा चुनें…","langOther":"अन्य","langSend":"भेजें","langSent":"धन्यवाद! हम इसे जोड़ेंगे: नई भाषाओं का क्रम ऐसे ही जवाबों से तय होता है।","langHint":"Kukuluku पहले से 250 भाषाओं में अनुवाद करता है: मेनू → “सभी भाषाएँ · 250” → खोज।","reinstall":"फिर से इंस्टॉल करें","note":"सिर्फ़ संस्करण और मेनू की भाषा, कोई पेज पता या निजी जानकारी नहीं।","again":"मन बदल गया? फिर से इंस्टॉल करें"},
    "bn": {"title":"Kukuluku সরানো হয়েছে","ask":"কেন সরালেন? একটি ক্লিকে আমরা জানতে পারব কী ঠিক করতে হবে।","reasons":["অনুবাদ দেখা যায়নি","আমার ভাষা নেই","অনুবাদে ভুল ছিল","আর দরকার নেই"],"thanks":"ধন্যবাদ! এটি সত্যিই সাহায্য করে।","no_translation":{"lead":"সাধারণত এই তিনটির একটি কারণ হয়:","list":["এটি Chrome-এর নিজস্ব পৃষ্ঠা ছিল। Chrome ওয়েব স্টোর, সেটিংস এবং নতুন ট্যাব পৃষ্ঠায় Chrome কোনো এক্সটেনশন চলতে দেয় না। যেকোনো ওয়েবসাইট খুলে সেখানে টেক্সট নির্বাচন করুন।","টেক্সট আগে থেকেই আপনার অনুবাদের ভাষায় ছিল: যেমন ইংরেজি সাইট এবং ইংরেজিতে অনুবাদ। অনুবাদ করার কিছু নেই, তাই উইন্ডো আসেনি। মেনুতে আপনার ভাষা বেছে নিন।","এটি Google Docs, Sheets বা PDF ছিল। সেখানে টেক্সট নির্বাচন করে Ctrl+C চাপুন।"]},"inaccurate":["অনুবাদ আসে Google Translate থেকে, যেটি Chrome-এ অন্তর্ভুক্ত।","আপনার নিজের AI কী দিয়ে অনুবাদ উইন্ডো কঠিন বাক্যের অর্থ, সুর ও প্রসঙ্গ ব্যাখ্যা করে।"],"not_needed":["ব্যবহার করে দেখার জন্য ধন্যবাদ। আবার অনুবাদ দরকার হলে ফিরে আসুন।"],"langAsk":"আপনার কোন ভাষা দরকার?","langPick":"ভাষা বেছে নিন…","langOther":"অন্যান্য","langSend":"পাঠান","langSent":"ধন্যবাদ! আমরা এটি যোগ করব: নতুন ভাষার ক্রম এমন উত্তর থেকেই ঠিক হয়।","langHint":"Kukuluku ইতিমধ্যে ২৫০টি ভাষায় অনুবাদ করে: মেনু → “All 250 languages” → অনুসন্ধান।","reinstall":"আবার ইনস্টল করুন","note":"শুধু সংস্করণ ও মেনুর ভাষা, কোনো পৃষ্ঠার ঠিকানা বা ব্যক্তিগত তথ্য নয়।","again":"মত বদলেছেন? আবার ইনস্টল করুন"},

    "iw": {"title":"Kukuluku הוסר","ask":"למה הסרתם אותו? לחיצה אחת תעזור לנו לדעת מה לתקן.","reasons":["התרגום לא הופיע","השפה שלי חסרה","היו שגיאות בתרגום","כבר לא צריך"],"thanks":"תודה! זה באמת עוזר.","no_translation":{"lead":"בדרך כלל זו אחת משלוש הסיבות האלה:","list":["זה היה דף של Chrome. ‏Chrome לא מאפשר לאף תוסף לפעול בחנות האינטרנט של Chrome, בהגדרות ובדף הכרטיסייה החדשה. פתחו אתר כלשהו ובחרו שם טקסט.","הטקסט כבר היה בשפת התרגום שלכם: למשל אתר באנגלית ותרגום לאנגלית. אין מה לתרגם, ולכן החלון לא מופיע. בחרו את השפה שלכם בתפריט.","זה היה Google Docs, ‏Sheets או PDF. שם בחרו את הטקסט ולחצו Ctrl+C."]},"inaccurate":["התרגום מגיע מ-Google Translate, אותו אחד שמובנה ב-Chrome.","עם מפתח AI משלכם, חלון התרגום מסביר את המשמעות, הטון וההקשר של ביטויים קשים."],"not_needed":["תודה שניסיתם. חזרו כשתצטרכו שוב תרגום."],"langAsk":"איזו שפה דרושה לכם?","langPick":"בחרו שפה…","langOther":"אחרת","langSend":"שליחה","langSent":"תודה! נוסיף אותה: סדר השפות החדשות נקבע לפי תשובות כאלה.","langHint":"Kukuluku כבר מתרגם ל-250 שפות: תפריט ← «כל השפות · 250» ← חיפוש.","reinstall":"התקנה מחדש","note":"רק הגרסה ושפת התפריט, בלי כתובות דפים ובלי מידע אישי.","again":"שיניתם את דעתכם? התקנה מחדש"}
  };

  var CODES = ['no_translation', 'no_language', 'inaccurate', 'not_needed'];
  // Значки строк: не появилось (перечёркнутый глаз), язык, перевод, выход.

  // Языки для «Какой язык нужен?»: языки меню и те, у кого меню ещё нет.

  function param(name) {
    var m = String(location.search || '').match(new RegExp('[?&]' + name + '=([^&]*)'));

  function textCode(code) {
    var c = String(code || '').toLowerCase();
    if (/^zh-(tw|hk|mo|hant)/.test(c)) return 'zh-tw';

  // Язык меню приходит в адресе, только если человек выбрал его сам. Иначе

  function icon(paths, cls) {

  // Первую строку нажимают чаще просто потому, что она первая: первые три

  function textAnswer(code) {

  function languageAnswer() {
